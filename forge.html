<title>Desert Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Vollbild-Viewport, links Objektliste, rechts Regler, unten Aktionsleiste.
   Eine bewusst dunkle Werkstatt-Optik (Einzel-Theme): Sand, Rost, oxidiertes Türkis als Statusfarbe. */
:root {
  color-scheme: dark;
  --bg: #110d09;
  --panel: rgba(25, 19, 13, 0.88);
  --panel-solid: #1c150f;
  --raise: #281f16;
  --line: #3d3022;
  --line-soft: #2a2117;
  --fg: #ecdfc6;
  --muted: #a8977a;
  --accent: #e8922e;
  --accent-ink: #1b1007;
  --teal: #62b9a8;
  --danger: #dc5a30;
  --font-display: 'Chakra Petch', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.45 var(--font-body);
  overflow: hidden;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* Kopfleiste */
#top {
  position: absolute; top: 0; left: 0; right: 0; height: 48px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 var(--gutter-r) 0 var(--gutter-l);
  background: linear-gradient(180deg, rgba(17, 13, 9, 0.82), rgba(17, 13, 9, 0));
  pointer-events: none;
}
#top > * { pointer-events: auto; }
.brand { font: 700 17px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 700; }
.brand-sub { font: 400 11px/1 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.toggle-btn { display: none; }

/* Panels */
.panel {
  position: absolute; top: 56px; bottom: 76px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  backdrop-filter: blur(6px);
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
#left { left: var(--gutter-l); width: 220px; }
#right { right: var(--gutter-r); width: 300px; }

.cat {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  padding: 12px 14px 6px; background: none; border: 0; text-align: left;
  font: 600 10.5px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.cat:hover { color: var(--fg); }
.cat .cnt { font: 400 10px/1 var(--font-mono); letter-spacing: 0; }
.cat::before { content: '▾'; margin-right: 2px; font-size: 11px; order: -1; transition: transform .15s; }
.cat[aria-expanded="false"]::before { transform: rotate(-90deg); }
.cat-body[hidden] { display: none; }
.obj-btn {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%;
  text-align: left; background: none; border: 0; border-left: 3px solid transparent;
  padding: 8px 14px 8px 11px; color: var(--fg);
}
.obj-btn:hover { background: var(--raise); }
.obj-btn[aria-pressed="true"] { border-left-color: var(--accent); background: var(--raise); }
.obj-btn .tag { font: 400 10px/1 var(--font-mono); color: var(--muted); white-space: nowrap; }

details { border-bottom: 1px solid var(--line-soft); }
details:last-child { border-bottom: 0; }
summary {
  list-style: none; cursor: pointer; padding: 11px 14px;
  font: 600 11px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg);
  display: flex; align-items: center; justify-content: space-between;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; font: 500 14px/1 var(--font-mono); color: var(--muted); }
details[open] > summary::after { content: '–'; }
.sec { padding: 2px 14px 14px; display: grid; gap: 11px; }

.ctl { display: grid; gap: 4px; min-width: 0; }
.ctl-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ctl label, .ctl .lab { color: var(--muted); font-size: 12px; }
.ctl output { font: 500 11.5px/1 var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 18px; }
select, input[type="number"] {
  width: 100%; box-sizing: border-box; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0;
}
.check { display: flex; align-items: center; gap: 9px; color: var(--fg); font-size: 12.5px; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; font-size: 11.5px; }
.chip:hover { border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; font-size: 12px; }
.mini:hover { border-color: var(--accent); }
.note { color: var(--muted); font-size: 11.5px; margin: 0; }

/* Aktionsleiste */
#bar {
  position: absolute; bottom: 14px; left: calc(var(--gutter-l) + 232px); right: calc(var(--gutter-r) + 312px);
  display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; pointer-events: none;
}
#bar > * { pointer-events: auto; }
.act {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px;
  padding: 10px 16px; font: 600 12px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase;
}
.act:hover:not(:disabled) { border-color: var(--accent); }
.act:disabled { opacity: 0.4; cursor: not-allowed; }
.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act.danger { border-color: var(--danger); color: #ffb59a; }
.act.danger:hover:not(:disabled) { background: var(--danger); color: #1a0903; }
.act[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #08201b; }
#bar select { width: auto; padding: 9px 8px; font-size: 12px; }

#hud {
  position: absolute; left: var(--gutter-l); bottom: 14px; width: 220px;
  font: 400 10.5px/1.5 var(--font-mono); color: var(--muted); pointer-events: none;
}
#hud b { color: var(--fg); font-weight: 500; }
#hint {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
  background: var(--panel-solid); border: 1px solid var(--teal); color: var(--fg);
  padding: 8px 14px; border-radius: 3px; font: 500 12px/1.3 var(--font-mono); text-align: center; max-width: calc(100% - 32px);
}
#hint[hidden] { display: none; }

#loading {
  position: absolute; inset: 0; z-index: 10; background: var(--bg);
  display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px;
  transition: opacity 0.5s;
}
#loading.done { opacity: 0; pointer-events: none; }
#loading .brand { font-size: 24px; }
#loading-track { width: min(320px, 70vw); height: 3px; background: var(--line); margin: 0 auto; }
#loading-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
#loading-text { font: 400 12px/1 var(--font-mono); color: var(--muted); }

/* Mittlere Fenster: Aktionsleiste über die volle Breite, Statistik ausblenden */
@media (max-width: 1180px) {
  #bar { left: var(--gutter-l); right: var(--gutter-r); }
  #hud { display: none; }
}
/* Schmale Bildschirme: Panels als Schubladen */
@media (max-width: 880px) {
  .toggle-btn { display: inline-block; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; font: 600 11px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
  .toggle-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .brand-sub, #hud { display: none; }
  .panel { display: none; left: var(--gutter-l); right: var(--gutter-r); width: auto; top: 54px; bottom: 74px; z-index: 5; background: var(--panel-solid); }
  body.p-left #left, body.p-right #right { display: block; }
  #bar { bottom: 12px; }
  .act { padding: 9px 11px; font-size: 11px; }
}
@media (max-width: 700px) {
  .panel { bottom: 118px; }
}
@media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
</style>

<div id="app">
  <div id="stage"></div>

  <header id="top">
    <div class="brand">Desert <b>Forge</b></div>
    <div class="brand-sub" id="brand-sub">Objekt-Werkstatt für Wüstenplaneten</div>
    <div class="spacer"></div>
    <button class="toggle-btn" id="tg-left" aria-pressed="false">Objekte</button>
    <button class="toggle-btn" id="tg-right" aria-pressed="false">Regler</button>
  </header>

  <aside class="panel" id="left" aria-label="Objekte"></aside>
  <aside class="panel" id="right" aria-label="Einstellungen"></aside>

  <div id="hint" hidden></div>

  <div id="bar">
    <button class="act primary" id="a-build">Aufbauen</button>
    <select id="a-style" aria-label="Aufbau-Stil">
      <option value="assemble">Zusammenfliegen</option>
      <option value="rise">Aus dem Sand</option>
      <option value="drop">Abwerfen</option>
      <option value="pop">Aufpoppen</option>
    </select>
    <button class="act danger" id="a-boom">Explodieren</button>
    <button class="act" id="a-reset">Zurücksetzen</button>
    <button class="act" id="a-test" aria-pressed="false">Testen</button>
  </div>

  <div id="hud"></div>

  <div id="loading">
    <div class="brand">Desert <b>Forge</b></div>
    <div id="loading-track"><div id="loading-bar"></div></div>
    <div id="loading-text">Starte</div>
  </div>
</div>
