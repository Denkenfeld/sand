<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#170a1c"><meta name="color-scheme" content="dark">
<title>Dünenturm</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#170a1c;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
iframe.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#170a1c;opacity:1;transition:opacity .45s ease}
iframe.view.back{opacity:0;pointer-events:none}
#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#170a1c;color:#ffb347;font:600 13px/1 ui-rounded,system-ui,sans-serif;letter-spacing:.35em;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
#veil.on{opacity:1}#veil i{width:34px;height:34px;border:3px solid #ffb34744;border-top-color:#ffb347;border-radius:50%;animation:sp 1s linear infinite;margin-right:14px}
@keyframes sp{to{transform:rotate(360deg)}}
#msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18%);transform:translateX(-50%);max-width:86vw;text-align:center;background:#000c;color:#ffe9c9;padding:11px 20px;border-radius:22px;border:1px solid #ffb34766;font:600 15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .3s;z-index:6}
#msg.on{opacity:1}
</style></head><body>
<div id="stage"></div>
<div id="veil"><i></i>LÄDT</div>
<div id="msg"></div>
<script>
/* Ton ist bei jedem Spielstart standardmäßig AN – eine frühere Stummschaltung gilt nicht für die nächste Sitzung.
   (Schaltet der Spieler ihn in dieser Sitzung selbst aus, merken sich Start-/Filmbildschirm das bis zum Neustart.) */
try{localStorage.setItem('dtSnd','1')}catch(e){}
</script>
<script src="js/dt-config.js"></script>
<script src="js/dt-shell.js"></script>
</body></html>
