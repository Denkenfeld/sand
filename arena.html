<!--
  XENO PIT – Arcade-Shooter (Standalone). Eine Datei, three.js kommt per CDN.

  EINBINDEN IN DEIN HAUPTSPIEL
  ----------------------------
  1) Laden:   location.href = 'arenagame.html?next=hauptspiel.html&back=hauptspiel.html'
     oder     <iframe src="arenagame.html?waves=5&diff=normal" allow="autoplay; fullscreen; pointer-lock">
  2) URL-Parameter (alle optional):
       next=URL      Wohin es nach dem Sieg und Klick auf WEITER geht
       back=URL      Wohin es bei Game Over / Zurück geht (zeigt Zurück-Knopf)
       diff=easy|normal|hard|nightmare   Schwierigkeit
       waves=1..5    Anzahl Stufen (letzte Stufe ist immer die Königin)   (Standard 5)
       lives=0..9    Continues (Standard 3)
       name=ABC      Initialen für Highscores
       skip=1        Titelbildschirm überspringen
       crt=0         Scanlines aus
  3) Ereignisse (postMessage an window.parent und window.opener, außerdem CustomEvent "xenopit" auf window
     und localStorage "xenopit_last"). Objekt: { type:'xeno-pit', event, score, kills, time, diff, ... }
       event = ready | start | stage | win | continue | lose | exit
     Im Hauptspiel:  addEventListener('message', e => { if (e.data?.type==='xeno-pit' && e.data.event==='win') {...} })
     (Prüfe e.origin, wenn das Spiel von einer anderen Domain kommt.)
  4) Programmatisch: window.XENOPIT.nav = url => ...   (eigene Navigation statt location.href)
-->

<script>
function AlienKit(THREE){
const V3=THREE.Vector3,PI=Math.PI,M=THREE.Mesh;
const DEF={seed:7,size:1.2,bulk:1,hunch:.5,headSize:1,headLen:.5,eyes:3,eyeSize:1,eyeHue:95,jaw:.4,teeth:14,horns:2,spikes:7,legs:4,legLen:1,armLen:1,tail:1,hue:28,sat:.55,spots:.5,slime:.6,bump:.5,speed:1.5,aggro:.6,health:100,damage:15};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const nz=(x,y,z)=>Math.sin(x*3.1+Math.sin(y*2.3+z*1.1))*Math.cos(y*3.7+Math.sin(z*2.9))*Math.sin(z*2.7+x*1.3+y);
// ---------- FX: Blut, Splats, herumfliegende Körperteile ----------
const fx={sc:null,P:[],D:[],S:[],gy:()=>0,geo:new THREE.SphereGeometry(1,7,5),
 mat:new THREE.MeshStandardMaterial({color:0xd8e020,roughness:.2,emissive:0x485000}),
 wound:new THREE.MeshStandardMaterial({color:0x9a2a14,roughness:.4,emissive:0x300800}),
 init(s,gy){fx.sc=s;if(gy)fx.gy=gy},
 blood(p,d,n,sp){n=Math.ceil(n*(fx.q||1));for(let i=0;i<n;i++){const m=new M(fx.geo,fx.mat),s=.012+Math.random()*.035;m.scale.setScalar(s);m.position.copy(p);fx.sc.add(m);
  const v=new V3(Math.random()-.5,Math.random()*.7,Math.random()-.5).multiplyScalar(sp*.6).addScaledVector(d,sp*(.3+Math.random()));fx.P.push({m,v,s})}},
 clear(){[...fx.P.map(q=>q.m),...fx.D.map(d=>d.o),...fx.S].forEach(o=>fx.sc.remove(o));fx.P=[];fx.D=[];fx.S=[]},
 update(dt){dt=Math.min(dt,.05);while(fx.D.length>(fx.dcap||70)){const d=fx.D.shift();d.o.traverse(o=>{if(o.geometry&&o.geometry!==fx.geo)o.geometry.dispose()});fx.sc.remove(d.o)}
  for(let i=fx.P.length-1;i>=0;i--){const q=fx.P[i];q.v.y-=9*dt;q.m.position.addScaledVector(q.v,dt);const gy=fx.gy(q.m.position);
   if(q.m.position.y<=gy+.01){const w=q.s*(2+Math.random()*3);q.m.scale.set(w,.004,w*(.5+Math.random()));q.m.position.y=gy+.005;fx.P.splice(i,1);fx.S.push(q.m);if(fx.S.length>(fx.cap||260))fx.sc.remove(fx.S.shift())}}
  for(const d of fx.D){if(d.rest)continue;d.v.y-=9*dt;d.o.position.addScaledVector(d.v,dt);d.o.rotation.x+=d.w.x*dt;d.o.rotation.y+=d.w.y*dt;d.o.rotation.z+=d.w.z*dt;
   const gy=fx.gy(d.o.position)+d.r;if(d.o.position.y<gy){d.o.position.y=gy;d.v.y*=-.3;d.v.x*=.6;d.v.z*=.6;d.w.multiplyScalar(.6);fx.blood(d.o.position,new V3(0,1,0),3,1.5);
    if(d.v.length()<.6){d.rest=1;if(d.flat){d.o.rotation.set(-PI/2,0,d.o.rotation.z)}}}}}};
// ---------- Alien bauen ----------
function create(P0,scene){
const P=Object.assign({},DEF,P0),R=rng(P.seed),rr=(a,b)=>a+R()*(b-a),S=P.size,HP=P.health,DT=P.detail||1;
const g=new THREE.Group(),rig=new THREE.Group(),body=new THREE.Group();g.add(rig);rig.add(body);g.scale.setScalar(S);scene.add(g);
let tailP;const hits=[],parts=[],legs=[],arms=[],segs=[],drips=[],bleed=[];
const base=new THREE.Color().setHSL(P.hue/360,P.sat,.36);
if(!fx.tex){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#777';x.fillRect(0,0,256,256);
 for(let r=0;r<16;r++)for(let q=0;q<16;q++){const px=q*16+(r%2)*8,py=r*16,gr=x.createRadialGradient(px,py,1,px,py,9);gr.addColorStop(0,'#eee');gr.addColorStop(.7,'#999');gr.addColorStop(1,'#222');x.fillStyle=gr;x.fillRect(px-9,py-9,18,18)}
 fx.tex=new THREE.CanvasTexture(c);fx.tex.wrapS=fx.tex.wrapT=THREE.RepeatWrapping;fx.tex.repeat.set(6,3)}
const pm=P.lite?{roughness:.8-.5*P.slime,metalness:.03}:{roughness:.8-.6*P.slime,metalness:.03,clearcoat:P.slime,clearcoatRoughness:.15,bumpMap:fx.tex,bumpScale:3},MT=P.lite?THREE.MeshStandardMaterial:THREE.MeshPhysicalMaterial;
const skin=new MT(Object.assign({vertexColors:true},pm)),limbM=new MT(Object.assign({color:base.clone().offsetHSL(0,0,-.04)},pm)),lidM=limbM.clone();lidM.side=THREE.DoubleSide;
const std=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5}),bone=std(0xe9dcbc),dk=std(0x241a12),mouthM=std(0x601018),acid=new THREE.MeshStandardMaterial({color:0xd8e020,emissive:0x889000,roughness:.2}),tongM=new THREE.MeshPhysicalMaterial({color:0xb03a48,roughness:.25,clearcoat:1});
const eyeC=new THREE.Color().setHSL(P.eyeHue/360,.95,.55),eyeM=new THREE.MeshPhysicalMaterial({color:eyeC,emissive:eyeC,emissiveIntensity:.8,roughness:.1,clearcoat:1});
const part=(name,hp,obj,o)=>{const p=Object.assign({name,hp,max:hp,obj,alive:true},o);parts.push(p);return p};
const tag=(m,p,u)=>{m.userData.part=p;if(u)Object.assign(m.userData,u);hits.push(m);return m};
const tagAll=(o,p)=>o.traverse(m=>{if(m.isMesh)tag(m,p)});
function blob(rad,sx,sy,sz,sd){const gm=new THREE.SphereGeometry(rad,Math.max(8,Math.round(28*DT)),Math.max(6,Math.round(20*DT))),p=gm.attributes.position,c=new Float32Array(p.count*3),col=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i)/rad,y=p.getY(i)/rad,z=p.getZ(i)/rad;
  const f=1+(nz(x*2+sd,y*2,z*2)*.6+nz(x*6,y*6,z*6+sd)*.25)*P.bump*.3;p.setXYZ(i,x*rad*f,y*rad*f,z*rad*f);
  const sp=nz(x*4+sd,y*4,z*4+1)>.8-P.spots*.55,st=P.spots>.3&&y>-.1&&Math.sin(z*9+nz(x*3,y*3,z*3+sd)*3)>.6;
  col.copy(base).offsetHSL(sp?.05:0,sp?.1:0,(sp?-.12:0)-(st?.1:0)-y*.06+Math.max(0,-y-.1)*.3+nz(x*9,y*9,z*9)*.03);col.toArray(c,i*3)}
 gm.setAttribute('color',new THREE.BufferAttribute(c,3));gm.computeVertexNormals();const m=new M(gm,skin);m.scale.set(sx,sy,sz);return m}
const cyl=(a,b,l,m)=>{const q=new M(new THREE.CylinderGeometry(a,b,l,Math.max(5,Math.round(10*DT)),1),m||limbM);q.position.y=-l/2;return q};
const curve=(r,l,m,b,n)=>{n=n||3;const G=new THREE.Group();let p=G;for(let i=0;i<n;i++){const j=new THREE.Group(),h=l/n,c=new M(new THREE.CylinderGeometry(r*(1-(i+1)/n)+.002,r*(1-i/n),h,Math.max(4,Math.round(7*DT))),m);c.position.y=h/2;j.add(c);if(i){j.position.y=h;j.rotation.x=b}p.add(j);p=j}return G};
const hipY=.9*P.legLen+.3,H=hipY,BY=hipY+.05,hs=P.headSize,bk=P.bulk;
// ---- Rumpf, Rippen, Hals ----
const tP=part('torso',HP,body);body.position.y=BY;body.rotation.x=P.hunch*.3;body.add(tag(blob(.5,.85*bk,.75*bk,1.3,R()*10),tP));
for(let i=0;i<6;i++){const z=.5-i*.2,q=Math.sqrt(1-(z/.65)**2),rb=new M(new THREE.TorusGeometry(1,.07,6,18,PI),limbM);rb.scale.set(.43*bk*q*1.02,.38*bk*q*1.02,1);rb.position.z=z;body.add(rb)}
const nk=blob(.3,.8*bk,.75*bk,1.2,R()*10);nk.position.set(0,.15,.95);body.add(tag(nk,tP));
// ---- Kopf: Schädel, Schnauze, Kiefer, Zunge, Zähne ----
const hd=new THREE.Group();hd.position.set(0,.22,1.2);body.add(hd);const hP=part('head',HP*.5,hd,{rr:.3,flat:0});
const SK=.36*hs,rx=SK*.85,ry=SK*.8,rz=SK*1.15,zc=.2*hs,SL=.5*hs*(1+P.headLen);
const sk=blob(SK,.85,.8,1.15,R()*10);sk.position.z=zc;hd.add(tag(sk,hP));
const sn=blob(.22*hs,.85,.62,SL*.8/(.22*hs),R()*10);sn.position.set(0,-.03*hs,.4*hs+SL*.2);hd.add(tag(sn,hP));
const jw=new THREE.Group();jw.position.set(0,-.14*hs,.12*hs);hd.add(jw);const JL=.4*hs+SL*.9;
const jm=blob(.2*hs,.9,.4,JL/2/(.2*hs),R()*10);jm.position.set(0,-.02*hs,JL/2);jw.add(tag(jm,hP));
const mo=new M(fx.geo,mouthM);mo.scale.set(.15*hs,.06*hs,JL*.45);mo.position.set(0,-.11*hs,.12*hs+JL*.45);hd.add(mo);
const tn=new M(fx.geo,tongM);tn.scale.set(.08*hs,.035*hs,JL*.4);tn.position.set(0,.03*hs,JL*.45);jw.add(tn);
const arc=(n,par,y,z0,z1,w,sz,flip,ex)=>{for(let i=0;i<n;i++){const f=n>1?i/(n-1):.5,a=PI*f,k=sz*(1+Math.max(0,1-Math.abs(f-.5)*7)*ex)*(.8+R()*.5),t=curve(.022*hs*k,.13*hs*k,bone,.3,2);
 t.position.set(-Math.cos(a)*w,y,z0+Math.sin(a)*(z1-z0));t.rotation.set(flip?PI:0,0,(R()-.5)*.3);par.add(t)}};
arc(Math.ceil(P.teeth/2),hd,-.145*hs,.12*hs,.4*hs+SL*.95,.17*hs,1,1,1.2);arc(Math.floor(P.teeth/2),jw,.07*hs,0,JL*.93,.15*hs,.8,0,.8);
// ---- Augen mit Lidern (böser Blick) ----
const n=P.eyes,cols=Math.ceil(n/2),er=.1*P.eyeSize*hs;
for(let i=0;i<n;i++){const rw=i<cols?0:1,cn=rw?n-cols:cols,ci=rw?i-cols:i,x=(ci-(cn-1)/2)*.17*hs,z=.3*hs-rw*.16*hs,u=x/rx,w=(z-zc)/rz,y=ry*Math.sqrt(Math.max(.02,1-u*u-w*w))*.93,ee=er*(.85+R()*.3);
 const e=new M(new THREE.SphereGeometry(ee,14,10),eyeM);e.position.set(x,y,z);const pu=new M(fx.geo,dk);pu.scale.set(ee*.16,ee*.75,ee*.3);pu.position.z=ee*.9;e.add(pu);hd.add(tag(e,hP,{eye:1}));
 const ld=new M(new THREE.SphereGeometry(ee*1.12,14,8,0,2*PI,0,PI*.5),lidM);ld.position.copy(e.position);ld.rotation.set(.45,0,Math.sign(x)*.4);hd.add(ld)}
for(let i=0;i<P.horns;i++){const sd=i%2?1:-1,k=i>>1,h=curve(.07*hs,.55*hs*(1+k*.3),bone,-.3,4);h.position.set(sd*.2*hs,.2*hs,.05*hs-k*.16*hs);h.rotation.set(-.5,0,-sd*.8);hd.add(h);tagAll(h,part('horn',HP*.12,h,{rr:.1}))}
for(let i=0;i<Math.round(P.slime*5);i++){const d=new M(fx.geo,new THREE.MeshPhysicalMaterial({color:0xb8dc70,transparent:true,opacity:.65,roughness:.05}));d.scale.set(.012,.1,.012);d.position.set((i/4-.5)*.3*hs,.05*hs,JL*(.85-Math.abs(i/4-.5)*.5));jw.add(d);drips.push(d)}
// ---- Rückenplatten ----
for(let i=0;i<P.spikes;i++){const z=P.spikes>1?.58-i/(P.spikes-1)*1.16:0,y=.375*bk*Math.sqrt(Math.max(0,1-(z/.65)**2)),s=curve(.06,.3*(.55+.7*Math.sin(PI*(i+.5)/P.spikes))*rr(.8,1.2),dk,-.3,3);s.position.set(0,y*.97,z);s.rotation.x=-.25;body.add(s);tagAll(s,part('spike',HP*.08,s,{rr:.05}))}
// ---- Arme mit Schulter, Ellbogenstachel, Krallenhand ----

 const r=Math.min(w,h)*.2,cx=w/2,cy=hz-r*.15,sg=bx.createLinearGradient(0,cy-r,0,cy+r);sg.addColorStop(0,'#ffe14a');sg.addColorStop(1,'#ff2bd6');bx.save();bx.beginPath();bx.rect(0,0,w,hz);bx.clip();bx.fillStyle=sg;bx.beginPath();bx.arc(cx,cy,r,0,6.3);bx.fill();bx.fillStyle=g;for(let k=0;k<7;k++)bx.fillRect(cx-r,cy+r*.05+k*r*.15,2*r,2+k*1.8);bx.restore();
 bx.fillStyle='#12042b';bx.fillRect(0,hz,w,h-hz);bx.strokeStyle='#ff2bd6';bx.lineWidth=2;for(let i=-12;i<=12;i++){bx.beginPath();bx.moveTo(cx+i*w*.02,hz);bx.lineTo(cx+i*w*.22,h);bx.stroke()}
 for(let k=0;k<10;k++){const f=((k+t*.6)%10)/10,y=hz+(h-hz)*f*f;bx.globalAlpha=.3+f*.7;bx.beginPath();bx.moveTo(0,y);bx.lineTo(w,y);bx.stroke()}bx.globalAlpha=1}
// ---------- Pixel-Figuren auf dem Titel ----------
const SPR={a:[["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."],["..X.....X..","X..X...X..X","X.XXXXXXX.X","XXX.XXX.XXX","XXXXXXXXXXX",".XXXXXXXXX.","..X.....X..",".X.......X."]],h:[["...XX...","..XXXX..","..XXXX..","...XX...",".XXXXXXX","X.XXXX..","..XXXX..","..X..X.."],["...XX...","..XXXX..","..XXXX..","...XX...",".XXXXXXX","X.XXXX..","..XXXX..",".X....X."]]};
const spx=(x,sp,px,col,ox,oy)=>{x.fillStyle=col;sp.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]=='X')x.fillRect(ox+i*px,oy+j*px,px,px)})};
const demo={ax:230,t:0,bul:[],pt:[],rs:0,sh:0};
function sprites(dt){const c=$('spr');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);demo.t+=dt;const f=(demo.t*3|0)%2;spx(x,SPR.h[f],4,'#27f3ff',8,26);
 if(demo.ax>0){demo.ax-=dt*22;spx(x,SPR.a[f],4,'#7dff6a',demo.ax,22);demo.sh-=dt;if(demo.sh<=0){demo.sh=.9;demo.bul.push(44)}}else if((demo.rs-=dt)<=0)demo.ax=c.width;
 demo.bul=demo.bul.filter(b=>{b+=0;return true});demo.bul.forEach((b,i)=>{demo.bul[i]=b+dt*170});x.fillStyle='#ffe14a';
 demo.bul=demo.bul.filter(b=>{x.fillRect(b,38,6,3);if(demo.ax>0&&b>=demo.ax){for(let i=0;i<16;i++)demo.pt.push({x:demo.ax+20,y:40,vx:U(-60,60),vy:U(-70,30),l:1});demo.ax=-1;demo.rs=1.2;G.au.blip(180,.12,.2);return false}return b<c.width});
 x.fillStyle='#7dff6a';demo.pt=demo.pt.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt;x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x|0,p.y|0,3,3);x.globalAlpha=1;return p.l>0})}
// ---------- Bildschirme ----------
const show=h=>{$('scr').innerHTML=h};
const hideAll=()=>{scr='';show('');clearInterval(cdT)};
function type(el,txt,sp){clearInterval(twT);twDone=0;let i=0;twT=setInterval(()=>{i+=2;el.textContent=txt.slice(0,i);if(i%6==0)G.au.blip(900,.015,.05);if(i>=txt.length){clearInterval(twT);twDone=1}},sp||28);el._t=txt}
const finishType=()=>{const e=$('tw');if(e){clearInterval(twT);e.textContent=e._t;twDone=1}};
function title(){hideAll();scr='title';G.au.music(1);$('bg').style.display='block';$('cv').style.visibility='hidden';$('hud').style.display='none';
 show('<div class="s"><div class="sub">XENO CORP PRÄSENTIERT</div><div class="logo">XENO PIT</div><div class="sub">DÜNEN-ARENA 2084 · '+opt.waves+(opt.waves>1?' STUFEN':' STUFE')+' · 1 KÖNIGIN</div><canvas id="spr" width="240" height="64"></canvas>'+
 '<div class="btn blink" data-go="start">▶ PRESS START</div><div class="opt" data-go="diff">◀ SCHWIERIGKEIT: '+DL[diff]+' ▶</div>'+(opt.back?'<div class="opt" data-go="back">↩ ZURÜCK ZUM HAUPTSPIEL</div>':'')+
 '<div class="hs">HI-SCORES<br>'+hs().map((e,i)=>(i+1)+'. <b>'+e.n+'</b> '+pad(e.s)).join('<br>')+'</div><div class="hs" style="opacity:.7">© 2084 XENO CORP · '+(isT?'TIPPEN = START · SCHWIERIGKEIT ANTIPPEN':'ENTER = START · ←/→ = SCHWIERIGKEIT')+'</div>'+(isT&&IOS&&!STAND?'<div class="hs" style="color:var(--c)">VOLLBILD: TEILEN ▸ ZUM HOME-BILDSCHIRM</div>':'')+'</div>')}
function brief(){scr='brief';G.au.init();G.au.jingle([69,72,76,81]);show('<div class="s dim"><div class="big" style="color:var(--c)">MISSION</div><div id="tw" class="txt"></div><div class="btn blink" data-go="go">▶ PRESS START</div></div>');
 type($('tw'),'JAHR 2084 · KOLONIE XENO-7\n\nEIN SCHWARM HAT DIE SAND-ARENA GEFLUTET.\n\n  1. ÜBERLEBE '+opt.waves+(opt.waves>1?' STUFEN':' STUFE')+'\n  2. ERLEGE DIE KÖNIGIN\n  3. LAUF ZUM PORTAL!\n\n'+(isT?'[LINKS] STICK = LAUFEN  [RECHTS] WISCHEN = ZIELEN\n[🔥] FEUER (ZIEHEN ZUM ZIELEN)  [💣] GRANATE\n[⏱] BULLET-TIME  [⟳] WAFFE  [⏸] PAUSE':'[WASD] LAUFEN  [MAUS] ZIELEN  [KLICK] FEUER\n[1-6] WAFFEN  [G] GRANATE  [Q] BULLET-TIME\n[SHIFT] DASH  [ESC] PAUSE'))}
async function lockScreen(){try{if(isT){const d=document.documentElement,p=d.requestFullscreen&&d.requestFullscreen({navigationUI:'hide'});p&&p.catch&&p.catch(()=>{});const o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');o&&o.catch&&o.catch(()=>{})}}catch(e){}try{const w=navigator.wakeLock&&navigator.wakeLock.request('screen');w&&w.catch&&w.catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G.on)try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}});
function begin(){lockScreen();tcReset();hideAll();$('bg').style.display='none';$('cv').style.visibility='visible';G.au.init();Object.assign(G.cfg,G.DIFF[diff]);G.cfg.diff=diff;G.start('camp')}
function continueScreen(){if(credits<=0)return gameOver();scr='cont';G.au.music(0);let n=9;show('<div class="s dim"><div class="big red">CONTINUE?</div><div class="logo" id="cd">9</div><div class="sub">CREDITS: '+credits+'</div><div class="btn blink" data-go="cont">▶ PRESS START</div></div>');
 clearInterval(cdT);cdT=setInterval(()=>{n--;$('cd').textContent=Math.max(0,n);G.au.blip(300+n*60,.12,.3);if(n<0){clearInterval(cdT);gameOver()}},1000)}
function contGo(){clearInterval(cdT);credits--;hideAll();G.cont();G.au.music(G.state().wave==opt.waves?3:2)}
function endHtml(title,cls,s,extra){const q=qual(s.score);return'<div class="s dim"><canvas id="fw"></canvas><div class="big '+cls+'">'+title+'</div>'+extra+'<div class="tbl">SCORE <b>'+pad(s.score)+'</b><br>KILLS <b>'+s.kills+'</b> · ZEIT <b>'+Math.floor(s.time/60)+':'+String(Math.floor(s.time%60)).padStart(2,'0')+'</b></div>'+
 (q?'<div class="sub blink">NEUER HIGHSCORE!</div><div>INITIALEN <input class="ini" id="ini" maxlength="3" value="'+opt.name+'"></div>':'')}
function gameOver(){scr='over';G.au.music(0);G.au.jingle([64,60,57,52],0,.2);const s=G.state();last={score:s.sc,kills:s.kills,time:s.time};emit('lose',last);
 show(endHtml('GAME OVER','red',last,'')+'<div><span class="btn" data-go="retry">↻ NOCHMAL</span>'+(opt.back?'<span class="btn" data-go="back">↩ ZURÜCK</span>':'<span class="btn" data-go="quit">☰ MENÜ</span>')+'</div></div>')}
function winScreen(s){last={score:s.score,kills:s.kills,time:s.time,deaths:s.deaths};scr='win';G.au.music(4);
 const rk=s.score/(opt.waves*1800)-s.deaths*.3,rank=rk>=1.5?'S':rk>=1.1?'A':rk>=.7?'B':'C',st=rank=='S'||rank=='A'?3:rank=='B'?2:1;last.rank=rank;emit('win',last);
 show(endHtml('MISSION COMPLETE','grn',last,'<div class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><div class="big" style="color:var(--y)">RANG '+rank+'</div>')+'<div id="tw" class="txt" style="min-height:7em"></div><div class="btn blink" data-go="fin">▶ '+(opt.next?'WEITER':'FERTIG')+'</div></div>');
 type($('tw'),'DIE KÖNIGIN IST GEFALLEN.\nDAS PORTAL ÖFFNET SICH UND DU TRITTST\nHINAUS IN DIE WÜSTENNACHT.\nDER SCHWARM IST VERSTUMMT.\nNOCH.\n\n- ENDE -',40)}
function fin(){const e=$('ini');saveHi(last.score,e&&e.value);emit('continue',last);if(opt.next)XP.nav(opt.next);else title()}
function leave(to){const e=$('ini');saveHi(last.score,e&&e.value);if(to=='back'){emit('exit',last);if(opt.back)XP.nav(opt.back)}else if(to=='retry'){begin()}else title()}
function act(a){G.au.init();G.au.blip(700,.06,.3);
 if(a=='start')brief();else if(a=='diff'){diff=DN[(DN.indexOf(diff)+1)%4];title()}else if(a=='go')twDone?begin():finishType();else if(a=='cont')contGo();else if(a=='fin')twDone||!$('tw')?fin():finishType();
 else if(a=='retry')leave('retry');else if(a=='quit')leave('quit');else if(a=='back'){emit('exit',last);if(opt.back)XP.nav(opt.back)}}
$('scr').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.go;if(a)act(a)});
addEventListener('keydown',e=>{if(!scr||e.target.tagName=='INPUT'&&e.code!='Enter')return;const ent=e.code=='Enter'||e.code=='Space';
 if(scr=='title'){if(ent)act('start');if(e.code=='ArrowLeft'||e.code=='ArrowRight'){diff=DN[(DN.indexOf(diff)+(e.code=='ArrowRight'?1:3))%4];G.au.blip(500,.05,.3);title()}}
 else if(scr=='brief'&&ent)act('go');else if(scr=='cont'&&ent)act('cont');else if(scr=='over'&&ent)act('retry');else if(scr=='win'&&ent)act('fin');if(ent)e.preventDefault()});
// ---------- Spiel-Ereignisse ----------
function card(h,ms,cls){const c=$('card');c.innerHTML=h;c.className=cls||'';c.style.display='block';clearTimeout(cardT);cardT=setTimeout(()=>{c.style.display='none'},ms)}
function countUp(el,to,ms){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);el.textContent='+'+Math.round(to*k);if(k<1){G.au.blip(500+k*600,.03,.1);requestAnimationFrame(f)}})(t0)}
G.ev.start=()=>{bossSeen=0;stName='';credits=opt.lives;G.au.music(2);card('GET READY!',2300);emit('start');$('hud').style.display='block'};
G.ev.stage=(n,N,st)=>{stName=st.name;card((st.boss&&N>1?'FINAL STAGE':'STAGE '+n+'/'+N)+'<small>'+st.name+'</small>',2600);G.au.music(st.boss?3:2);emit('stage',{stage:n})};
G.ev.clear=(n,s)=>{card('<span class="grn">STAGE CLEAR!</span><small>ZEIT '+s.time.toFixed(1)+'s</small><small>ZEIT-BONUS <b id="c1">+0</b></small>'+(s.nd?'<small>KEIN SCHADEN <b id="c2">+0</b></small>':'')+'<small>SCORE '+pad(s.score)+'</small>',4600);setTimeout(()=>{const a=$('c1');a&&countUp(a,s.tb,900);const b=$('c2');b&&setTimeout(()=>countUp(b,s.nd,700),900)},300)};
G.ev.exit=()=>{card('⚡ PORTAL OFFEN<small>LAUF ZUM AUSGANG!</small>',4500,'ok');G.au.music(4)};
G.ev.death=s=>{last=s;continueScreen()};G.ev.win=s=>winScreen(s);G.ev.quit=()=>{G.stop();title()};
function hudUpd(){const s=G.state(),h=$('hud'),show=!s.pause&&!scr&&!s.over;if(isT){$('tc').style.display=show&&!portrait()?'block':'none';if(!show&&(TC.js>=0||TC.fi>=0||TC.zoom))tcReset();if(navigator.vibrate&&s.hp<lastHp-.5)navigator.vibrate(40);lastHp=s.hp}h.style.display=s.pause||scr?'none':'block';if(s.pause||scr)return;
 const t='STAGE '+Math.max(1,s.wave)+'/'+s.stages+(stName?' · '+stName:'')+(s.exit?'':' · ALIENS '+s.left);if(t!=hudS){hudS=t;$('ht').textContent=t}
 const b=s.boss;$('hb').style.display=b?'block':'none';if(b){$('hbi').style.width=Math.max(0,b.hp/b.max*100)+'%';if(!bossSeen){bossSeen=1;G.au.siren();card('⚠ WARNING ⚠<small>DIE KÖNIGIN ERWACHT</small>',3000,'red')}}
 $('ha').style.display=s.exit?'block':'none';if(s.exit){const dx=s.exit.x-s.x,dz=s.exit.z-s.z;$('ha').firstChild.style.transform='rotate('+(-(Math.atan2(-dx,-dz)-s.yaw)*57.3)+'deg)';$('had').textContent='AUSGANG '+Math.round(Math.hypot(dx,dz))+'m'}
 $('hc').textContent='CONTINUES '+'♥'.repeat(credits)+'♡'.repeat(Math.max(0,opt.lives-credits))}
function fwStep(dt){const c=$('fw');if(!c)return;if(c.width!=innerWidth){c.width=innerWidth;c.height=innerHeight}const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);fwT-=dt;
 if(fwT<=0){fwT=U(.3,.8);const cx=U(.15,.85)*c.width,cy=U(.12,.5)*c.height,col=['#ff2bd6','#27f3ff','#ffe14a','#7dff6a'][rnd()*4|0];for(let i=0;i<36;i++){const a=i/36*6.28,s=U(60,180);fw.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col})}G.au.blip(U(200,500),.15,.12)}
 fw=fw.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.l-=dt*.7;x.fillStyle=p.c;x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x|0,p.y|0,4,4);x.globalAlpha=1;return p.l>0})}
XP.tick=dt=>{gov(dt);if(G.on){G.update(dt);R.render(S,C);hudUpd()}else drawBg(performance.now()/1000);if(scr=='title')sprites(dt);if(scr=='win'||scr=='over')fwStep(dt)};
let T=0;(function f(n){requestAnimationFrame(f);const dt=Math.min(.05,(n-T)/1000||0);T=n;XP.tick(dt)})(0);
XP.begin=begin;XP.title=title;XP.get=()=>({scr,credits,diff,opt,pr,isT,q:G.cfg.qual});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
emit('ready');if(opt.skip)begin();else title();
})();
