function insideF(x,y,z,r){

function placeOrbs(count,rmin,rmax,margin){

const mkNoiseBuf=c=>{const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};

const mkIR=(c,sec)=>{const n=c.sampleRate*sec|0,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return b;};
const Gn=(c,v,dest)=>{const g=c.createGain();g.gain.value=v;if(dest)g.connect(dest);return g;};
const BP=(c,f,q,dest)=>{const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;if(dest)b.connect(dest);return b;};
/* kurzer Ton mit Pitch-Glide und Hüllkurve */
function blip(c,dest,wave,t0,f0,f1,dur,amp,att=0.006){
  amp=Math.max(amp,0.0003);
  const o=c.createOscillator(); if(wave)o.setPeriodicWave(wave); else o.type='sine';
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur*0.85);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(amp,t0+att); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.03);
}
const killer=(list,out)=>()=>{list.forEach(n=>{try{n.stop();}catch(e){}});try{out.disconnect();}catch(e){}};

/* 6) Spieluhr – Pentatonik: jede Zugstärke ist eine Note, Reiben spielt Läufe */
'Spieluhr'(c,bus){
  const out=Gn(c,0.8,bus), SC=[0,2,4,7,9,12,14,16,19,21,24]; let last=-1,lastT=0,acc=0;
  const pluck=(idx,vel,delay=0,mul=1)=>{
    const t0=c.currentTime+delay, f=523.25*Snd.pm*mul*Math.pow(2,SC[clamp(idx,0,SC.length-1)]/12), amp=0.07+0.2*vel;
    [[1,1,1.0],[2.76,0.22,0.35],[5.4,0.08,0.15]].forEach(([m,a,d])=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f*m;
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0003,amp*a),t0+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.15+d*1.1);
      o.connect(g); g.connect(out); o.start(t0); o.stop(t0+0.3+d*1.1); });
  };
  return{
    update(S,dt){ const now=c.currentTime, idx=S.p>0.03?Math.round(S.p*(SC.length-1)):-1;
      if(idx!==last){ if(idx<0)last=-1; else if(now-lastT>0.045){pluck(idx,clamp(S.sqz?S.sq*1.2:0.15+S.wh,0.1,1));lastT=now;last=idx;} }

const Snd={
  c:null,master:null,bus:null,wet:null,voice:null,pm:1,
  S:{p:0,sq:0,wh:0,rub:0,fl:0,fi:0,sqz:true,held:false,n:0},
  ensure(){
    if(!this.c){
      try{
        const c=this.c=new(window.AudioContext||window.webkitAudioContext)();
        const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6;
        this.master=c.createGain(); this.master.connect(comp); comp.connect(c.destination);
        this.bus=c.createGain(); this.bus.connect(this.master);
        const conv=c.createConvolver(); conv.buffer=mkIR(c,0.9); this.wet=c.createGain();
        this.bus.connect(conv); conv.connect(this.wet); this.wet.connect(this.master);

const LQ0=new THREE.Quaternion(), LQ1=new THREE.Quaternion().setFromEuler(new THREE.Euler(-.49,.2,0,'YXZ'));
const ease=x=>x*x*(3-2*x), tws=[];
const tween=(d,f)=>new Promise(r=>tws.push({t:0,d,f,r}));

async function lidTo(v){ const a=lidE; await tween(1.0,k=>{lidE=a+(v-a)*ease(k);}); }
async function toggleLid(){ if(busy||!P.potOn)return; busy=true;ui(); await lidTo(lidE>.5?0:1); busy=false;ui(); }
async function toggleDump(){
  if(busy||!P.potOn)return; busy=true;ui(); const to=dm<.5?1:0, a=dm; dDir=to?1:-1;
  if(lidE<.5) await lidTo(1);

  await tween(1.2,k=>{dm=a+(to-a)*ease(k); dArc=Math.sin(Math.PI*k);});
  dArc=0; sbImpulse(-2.5); Snd.onLand(.8); busy=false;ui();
}

/* Bügeleisen-Dampf: Menge wächst mit Anpressdruck und Bügeldauer */
const IR={on:0,acc:0,hiss:null,pool:[]},_iv=new THREE.Vector3();
for(let i=0;i<90;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sTex,transparent:true,depthWrite:false,opacity:0,color:0xfff6fb}));s.visible=false;
  s.userData={l:1,vx:0,vy:0,vz:0,s0:.3,a:.3,life:1.4};scene.add(s);IR.pool.push(s);}
function ironEmit(lx,ly,lz,I,dt){
  IR.on=Math.max(IR.on,I);IR.acc+=dt*(4+34*I);
  while(IR.acc>=1){IR.acc-=1;const s=IR.pool.find(q=>q.userData.l>=1);if(!s)break;const u=s.userData,a=Math.random()*6.283,r=.42+Math.random()*.25,sc=dumpG.scale.x;
    _iv.set(lx+Math.cos(a)*r,ly+.08+Math.random()*.1,lz+Math.sin(a)*r);dumpG.localToWorld(_iv);s.position.copy(_iv);
    u.l=0;u.vx=Math.cos(a)*(.12+.2*I)*sc;u.vz=Math.sin(a)*(.12+.2*I)*sc;u.vy=(.45+.55*I)*sc*(.7+Math.random()*.6);
    u.s0=(.28+.2*Math.random())*(.8+.5*I)*sc;u.a=.16+.2*Math.min(1,I);u.life=1.2+Math.random()*.8;s.visible=true;}
}
function ironTick(dt){
  for(const s of IR.pool){const u=s.userData;if(u.l>=1)continue;u.l+=dt/u.life;if(u.l>=1){s.visible=false;s.material.opacity=0;continue;}
    s.position.x+=u.vx*dt;s.position.y+=u.vy*dt;s.position.z+=u.vz*dt;u.vy*=1-.4*dt;const z=u.s0*(1+2*u.l);s.scale.set(z,z,1);s.material.opacity=u.a*Math.sin(Math.PI*u.l);}
  if(Snd.c&&!IR.hiss&&IR.on>0){const c=Snd.c,src=c.createBufferSource();src.buffer=mkNoiseBuf(c);src.loop=true;const f=BP(c,5200,.7),g=Gn(c,0,Snd.bus);src.connect(f);f.connect(g);src.start();IR.hiss=g;}
  if(IR.hiss&&Snd.c)IR.hiss.gain.setTargetAtTime(P.sound?.05*IR.on:0,Snd.c.currentTime,.12);
  IR.on=0;
}
/* Körbchen-Regler übernehmen / Körbchen ein- und ausblenden */
function applyPot(){
  potG.visible=P.potOn; potbar.style.display=P.potOn?'flex':'none';
  if(!P.potOn){ tws.length=0; busy=false; dm=0; dArc=0; lidE=0; ui(); }      // Dumpling steht dann wieder auf dem Tisch
  for(const m of [bwMat,innerMat,lidMat,bandMat,floorMat]){ m.color.set(P.potTint); m.roughness=P.potRough; m.clearcoat=P.potGloss; }
  paper.visible=P.paper;
  for(const s of steam) s.visible=P.potOn;
}
function potStep(dt){
  ironTick(dt);
  for(let i=tws.length;i--;){const a=tws[i];a.t+=dt;const k=Math.min(1,a.t/a.d);a.f(k);if(k>=1){tws.splice(i,1);a.r();}}
  const ps=P.potSize; potG.position.set(P.potX,GY,P.potZ); potG.scale.setScalar(ps); potG.rotation.y=P.potRot*Math.PI/180;
  lid.position.lerpVectors(LID0,LID1,lidE); lid.position.y+=.5*Math.sin(Math.PI*lidE);
  lid.quaternion.copy(LQ0).slerp(LQ1,lidE);
  const sc=P.size+(sIn()-P.size)*dm, bottom=GY+(FLOOR*ps+.012)*dm+1.9*dArc;     // im Körbchen schrumpft der Squishy passend
  dumpG.scale.setScalar(sc); U.uGS.value=sc; dumpG.rotation.z=.28*dDir*Math.sin(Math.PI*2*dArc*.5)*(dArc>0?1:0);
  dumpG.position.set(P.potX*dm,bottom-sc*GY,P.potZ*dm);
  if(dm>.995&&lidE<.35){ const gy=bottom-sc*GY;                          // im Körbchen: Deckel = Decke, Wand = Zylinder (echte Soft-Body-Kollision)
    SB.ceil=Math.max((GY+ps*(lid.position.y+.2)-gy)/sc-.02,GY+.75); SB.rmax=.86*ps/sc; } else { SB.ceil=1e9; SB.rmax=1e9; }
  U.uShK.value*=1-sstep(.02,.25,dm);                                         // Boden-Schatten bleibt nicht zurück
  const warm=(P.potOn&&dm>.9&&lidE>.5&&P.steam)?1:0;
  for(const s of steam){ const u=s.userData; u.l+=dt/2.6; if(u.l>1){u.l-=1;u.x=(Math.random()-.5)*.5;u.z=(Math.random()-.5)*.4;u.w=Math.random()*6;}
    s.position.set(P.potX+u.x*ps+Math.sin(u.l*4+u.w)*.12,GY+1.0*ps+u.l*1.5,P.potZ+u.z*ps);
    const z=(.5+u.l*1.1)*ps; s.scale.set(z,z,1); s.material.opacity+=(warm*.34*P.steamAmt*Math.sin(Math.PI*u.l)-s.material.opacity)*Math.min(1,dt*6); }
}

function download(name,data,type){
  const b=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* 2) statisches 3D-Modell (Ruhepose, Pivot = Standfläche) für Blender / Unity / Godot / three.js */
function exportGLB(){
  const sc=new THREE.Scene(), grp=new THREE.Group(); grp.name='Squishy';
  grp.position.y=-GY*EX.scale*P.size; grp.scale.setScalar(EX.scale*P.size); sc.add(grp);

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(Float32Array.from(rest),3));
  g.setIndex(shellGeo.getIndex().clone()); g.computeVertexNormals();
  const skin=shellMat.clone(); skin.name='Silikonhaut';
  const mEff=P.milk+0.2; skin.transmission=1-clamp(mEff+(1-mEff)*P.opaque,0,1);          // Deckkraft ins Modell übernehmen
  const shellM=new THREE.Mesh(g,skin); shellM.name='Haut'; grp.add(shellM);

  if(P.opaque<0.97){
    const og=new THREE.Group(); og.name='Orbs'; grp.add(og);
    const sphere=new THREE.SphereGeometry(1,28,20), cache=new Map(), c=new THREE.Color();
    for(let i=0;i<NO;i++){
      const o=orbs[i]; orbMesh.getColorAt(i,c); const hex=c.getHexString();
      let mat=cache.get(hex);
      if(!mat){ mat=new THREE.MeshPhysicalMaterial({name:'Orb_'+hex,color:c.clone(),roughness:P.orbGloss,metalness:P.orbMetal,clearcoat:1,clearcoatRoughness:0.08,
        iridescence:0.8,iridescenceIOR:1.5,emissive:c.clone(),emissiveIntensity:0.12}); cache.set(hex,mat); }
      const m=new THREE.Mesh(sphere,mat); m.name='Orb_'+i; m.position.set(o.rx,o.ry,o.rz); m.scale.setScalar(o.r); og.add(m);
    }
  }
  if(P.showFace){
    const fg=new THREE.BufferGeometry();
    fg.setAttribute('position',new THREE.BufferAttribute(Float32Array.from(faceRest),3));
    fg.setAttribute('uv',new THREE.BufferAttribute(faceUV,2)); fg.setIndex(faceIdx); fg.computeVertexNormals();
    const fp=fg.attributes.position.array,fn=fg.attributes.normal.array;
    for(let i=0;i<fp.length;i++)fp[i]+=fn[i]*0.009;
    const fm=new THREE.MeshStandardMaterial({name:'Gesicht',map:faceTex.happy,transparent:true,roughness:0.3,metalness:0,depthWrite:false});
    const fMesh=new THREE.Mesh(fg,fm); fMesh.name='Gesicht'; grp.add(fMesh);
  }
  new GLTFExporter().parse(sc,buf=>download('squishy-'+stamp()+'.glb',new Blob([buf],{type:'model/gltf-binary'})),
    err=>alert('GLB-Export fehlgeschlagen: '+(err&&err.message||err)),{binary:true});
}

/* 3) Blueprint als JSON (Parameter + Orb-Positionen) */
function exportJSON(){
  const r3=v=>Math.round(v*1000)/1000, c=new THREE.Color();
  const data={app:'Squishy Studio',version:3,
    note:'Einheiten wie im Studio. Orb-y ist relativ zur Standfläche (y=0 = Boden). Orbs: Mittelpunkt x/y/z, Radius r.',
    groundY:r3(GY),params:P,orbColors:orbCols,
    orbs:orbs.map((o,i)=>{orbMesh.getColorAt(i,c);return{x:r3(o.rx*P.size),y:r3((o.ry-GY)*P.size),z:r3(o.rz*P.size),r:r3(o.r*P.size),color:'#'+c.getHexString()};})};
  download('squishy-'+stamp()+'.json',JSON.stringify(data,null,1),'application/json');
}

const PEN=[523,587,659,784,880,988,1175,1319,1568,1760];
function tone(f0,f1,d,v=.2,type='sine',at=0){if(!Snd.c||!P.sound)return;const c=Snd.c,t0=c.currentTime+at,o=c.createOscillator(),g=c.createGain(),m=Snd.pm||1;
  o.type=type;o.frequency.setValueAtTime(f0*m,t0);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1*m),t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(Snd.bus);o.start(t0);o.stop(t0+d+.05);}
const sTink=n=>{const f=PEN[Math.min(9,n)];tone(f,f*1.01,.35,.12,'sine');tone(f*2,f*2,.2,.04,'sine');};

/* ---------- Loop: Herzen beim Ziehen/Quetschen, Zeichnen */
let acc=0,held=false,maxP=0,lx=0,ly=0,last=performance.now(),gcheck=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(paused)return;
  bLid.style.display=bIn.style.display=P.potOn?'':'none';vbar.style.display=VS.ctl?'flex':'none';
  let any=false;
  for(const c of pointers.values()){any=true;lx=c.sx;ly=c.sy;maxP=Math.max(maxP,c.press);
    if(c.press>.1&&ps.length<90){acc+=(5+Math.min(c.press,.8)*24)*dt;while(acc>=1){acc--;heart(lx+rnd2(-16,16),ly-rnd2(0,20));}if(Math.random()<.25)spark(lx,ly,1,'#fff');}}
  if(held&&!any&&maxP>.14)for(let i=0,n=3+Math.min(8,Math.round(maxP*12));i<n;i++)heart(lx+rnd2(-20,20),ly+rnd2(-10,10));   // Herzchen-Schwall beim Loslassen
  if(!any)maxP=0;held=any;
  gcheck+=dt;if(gcheck>.5){gcheck=0;for(const p in SHOP)if(locked(p,P[p])&&!(FCUR&&FCUR.p[p]===P[p])){const c=ctr(p);if(c)c.setValue(DEFAULTS.P[p]);refreshGUI();}}
  fg.setTransform(dpr,0,0,dpr,0,0);fg.clearRect(0,0,W,H);const[jx,jy]=tgt(jar),[px,py]=tgt(pp);
  for(let i=ps.length;i--;){const p=ps[i];p.t+=dt;
    if(p.k==='h'){let a=1,s;
      if(p.t<p.rise){p.x+=p.vx*dt+Math.sin(p.t*8+p.ph)*.7;p.y+=p.vy*dt;p.vy*=.975;s=p.sc*back(Math.min(1,p.t/.28));if(Math.random()<.12)spark(p.x,p.y,1,'#ffd1e6');}
      else{if(!p.f){p.sx=p.x;p.sy=p.y;}p.f+=dt/.6;const u=ease(Math.min(1,p.f)),cx=p.sx+(jx-p.sx)*.15,cy=p.sy-110;
        p.x=(1-u)*(1-u)*p.sx+2*(1-u)*u*cx+u*u*jx;p.y=(1-u)*(1-u)*p.sy+2*(1-u)*u*cy+u*u*jy;s=p.sc*(1-.5*u);p.rot+=dt*3;
        if(p.f>=1){ps.splice(i,1);spark(jx,jy,3,'#ffd1e6');addHeart();continue;}}
      fg.save();fg.translate(p.x,p.y);fg.rotate(p.rot);const z=44*s;fg.globalAlpha=a;fg.drawImage(p.spr,-z/2,-z/2,z,z);fg.restore();}
    else if(p.k==='s'){if(p.t>p.l){ps.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;fg.globalAlpha=1-p.t/p.l;fg.fillStyle=p.col;star(fg,p.x,p.y,p.r*(1-p.t/p.l*.5),p.rot+p.t*3);fg.globalAlpha=1;}
    else{ // Perle
      if(p.st===0){p.vy+=2400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>=p.gy){p.y=p.gy;if(p.b<2){p.vy=-p.vy*.45;p.b++;sPlop();spark(p.x,p.y,4,'#e9d6ff');}else{p.st=1;p.t=0;sGlint();}}}
      else if(p.st===1){if(p.t>.8){p.st=2;p.t=0;p.sx=p.x;p.sy=p.y;}if(Math.random()<.2)spark(p.x+rnd2(-p.sz/2,p.sz/2),p.y-p.sz/2+rnd2(-8,8),1,'#fff');}
      else{const u=ease(Math.min(1,p.t/.7)),cx=(p.sx+px)/2,cy=Math.min(p.sy,py)-120;p.x=(1-u)*(1-u)*p.sx+2*(1-u)*u*cx+u*u*px;p.y=(1-u)*(1-u)*p.sy+2*(1-u)*u*cy+u*u*py;spark(p.x,p.y,1,'#e9d6ff');
        if(u>=1){ps.splice(i,1);addPearl();continue;}}
      const z=p.sz*(p.st===2?1-.45*ease(Math.min(1,p.t/.7)):1);fg.drawImage(PS,p.x-z/2,p.y-z/2,z,z);
      fg.fillStyle='#fff';fg.shadowColor='#fff';fg.shadowBlur=10;fg.globalAlpha=.6+.4*Math.sin(now/90);star(fg,p.x+z*.28,p.y-z*.3,z*.2,now/400);fg.shadowBlur=0;fg.globalAlpha=1;}}}

  const QN={auto:'Auto',high:'Schön',low:'Sparsam'},QX={auto:'high',high:'low',low:'auto'};
  const rows=[['🔊 Sound',()=>P.sound?'an':'aus',()=>{P.sound=!P.sound;Snd.apply();}],
    ['✨ Selbst anstupsen',()=>P.autoPoke?'an':'aus',()=>{P.autoPoke=!P.autoPoke;}],
    ['🖼️ Grafik',()=>QN[Q.mode],()=>setQ(QX[Q.mode])]];
  rows.forEach(([l,g,f])=>{const b=document.createElement('button');b.className='chip set';const u=()=>{b.innerHTML=`<span>${l}</span><b>${g()}</b>`;};u();
    b.onclick=()=>{f();refreshGUI();u();};m.querySelector('#pset').appendChild(b);});
  const close=()=>{m.remove();paused=false;Snd.ensure();};
  m.querySelector('#pgo').onclick=close;m.querySelector('#prs').onclick=()=>{resetSquishy();close();};m.onclick=e=>{if(e.target===m)close();};
  m.querySelector('#pall').onclick=()=>{const c=mdl(`<div class="big">🗑️</div><h3>Alles löschen?</h3><p>Perlen, Freischaltungen und Einstellungen sind danach weg.</p><div class="row"><button class="btn" id="yes">Ja, alles neu</button><button class="btn g" id="no">Abbrechen</button></div>`);
    c.querySelector('#no').onclick=()=>c.remove();
    c.querySelector('#yes').onclick=()=>{try{localStorage.removeItem('squishy-kids');localStorage.removeItem('squishy-q');}catch(e){}location.reload();};};
}
bPa.onclick=openPause;addEventListener('keydown',e=>{if(e.code==='KeyP'&&!paused)openPause();});
updHud();
if(S.friend&&S.friend!=='Dumpi'&&!locked('friend',S.friend))loadFriend(S.friend,true);   // zuletzt gespielten Freund wieder laden
}

const clock=new THREE.Clock();let first=true;
let fAcc=0,fCnt=0,fOk=0;
function frame(){
  requestAnimationFrame(frame);
  const raw=clock.getDelta(),dt=Math.min(raw,1/20);
  if(paused)return;                                   // Pause: weder rechnen noch rendern (spart Akku)
  if(Q.mode==='auto'&&raw<.25){fAcc+=raw;if(++fCnt>=40){const ms=fAcc/fCnt;fAcc=fCnt=0;
    if(ms>.0215&&PR>PRMIN+.01){setPR(PR-.15);fOk=0;}else if(ms<.0125&&PR<PRMAX-.01){if(++fOk>=4){fOk=0;setPR(PR+.15);}}else fOk=0;}}
  step(dt);potStep(dt);
  const tx=P.potOn?0.41*P.potX:0, dX=(tx-controls.target.x)*Math.min(1,dt*3);       // Kamera schwenkt sanft mit dem Körbchen
  controls.target.x+=dX; camera.position.x+=dX;
  controls.update();composer.render();
  if(first){first=false;const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),800);}
}
frame();
</script>
