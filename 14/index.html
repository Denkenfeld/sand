<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#170a1c"><title>Dünenturm</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#170a1c;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#ffe9c9;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}iframe.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#170a1c;opacity:1;transition:opacity .45s ease}iframe.view.back{opacity:0;pointer-events:none}
#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#170a1c;color:#ffb347;letter-spacing:.25em;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}#veil.on{opacity:1}
#veil i{width:30px;height:30px;border:3px solid #ffb34744;border-top-color:#ffb347;border-radius:50%;animation:spin 1s linear infinite;margin-right:14px}@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);max-width:86vw;text-align:center;background:#000c;color:#ffe9c9;padding:11px 20px;border-radius:22px;border:1px solid #ffb34766;opacity:0;pointer-events:none;transition:opacity .3s;z-index:6}#msg.on{opacity:1}
</style></head><body>
<div id="stage"></div><div id="veil"><i></i>LÄDT</div><div id="msg"></div>
<script>
/* Neue Versionskennung pro Seitenaufruf: verhindert alte Konfigurationen und Level aus dem Browsercache. */
window.DT_VER='mission-r1-'+Date.now();
try{localStorage.setItem('dtSnd','1')}catch(e){}
(function(){
 function load(path){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=path+'?v='+window.DT_VER;s.onload=resolve;s.onerror=function(){reject(new Error('Datei konnte nicht geladen werden: '+path))};document.head.appendChild(s)})}
 load('js/dt-config.js').then(function(){
   if(!window.DT_CONFIG||!DT_CONFIG.levels[4]||!DT_CONFIG.levels[4].ready)throw new Error('Konfiguration nicht aktualisiert: bitte js/dt-config.js aus dem Level-5-Fix hochladen.');
   return load('js/dt-shell.js');
 }).catch(function(e){var m=document.getElementById('msg');m.textContent=e.message;m.className='on';console.error(e)});
})();
</script></body></html>
