<script>
const T=THREE,V3=T.Vector3,Q=T.Quaternion,R=420,$=i=>document.getElementById(i);
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),sm=(a,b,x)=>{x=cl((x-a)/(b-a),0,1);return x*x*(3-2*x)},Lp=(a,b,t)=>a+(b-a)*t;
/* ---------- Terrain: Rauschen + asymmetrische Dünenkämme ---------- */
const hs=(x,y,z)=>{const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h)};
function vn(x,y,z){const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z);let u=x-i,v=y-j,w=z-k;u*=u*(3-2*u);v*=v*(3-2*v);w*=w*(3-2*w);
const a=(p,q,r)=>hs(i+p,j+q,k+r);
return Lp(Lp(Lp(a(0,0,0),a(1,0,0),u),Lp(a(0,1,0),a(1,1,0),u),v),Lp(Lp(a(0,0,1),a(1,0,1),u),Lp(a(0,1,1),a(1,1,1),u),v),w)}
const fb=(x,y,z,o)=>{let s=0,a=.5,t=0;for(let i=0;i<o;i++){s+=a*vn(x,y,z);t+=a;x*=2.03;y*=2.03;z*=2.03;a*=.5}return s/t};
let lc=0;
function H(d){const x=d.x,y=d.y,z=d.z,m=fb(x*2+5,y*2,z*2,3);lc=m;
const w=(x*.62+y*.18+z*.76)*58+fb(x*5,y*5+9,z*5,3)*9,f=w-Math.floor(w),p=f<.72?f/.72:(1-f)/.28,pr=p*p*(3-2*p);
return R+(m-.5)*30+(pr-.5)*7*(.3+m*1.2)+fb(x*30,y*30,z*30,2)*.6}
function TN(up){const t1=new V3(0,1,0).cross(up);if(t1.lengthSq()<.01)t1.set(1,0,0).cross(up);t1.normalize();const t2=up.clone().cross(t1),e=1.5/R;
const P=(a,s)=>{const d=up.clone().addScaledVector(a,s*e).normalize();return d.multiplyScalar(H(d))};
return P(t1,1).sub(P(t1,-1)).cross(P(t2,1).sub(P(t2,-1))).normalize()}
/* ---------- Shader ---------- */
const SK=`uniform vec3 uSun;
float hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
vec3 skyCol(vec3 d,vec3 up){float e=dot(d,up),su=dot(up,uSun),day=smoothstep(-.18,.25,su),tw=exp(-abs(su+.03)*8.),sg=smoothstep(-.1,.05,su);
vec3 zen=mix(vec3(.002,.004,.015),vec3(.12,.27,.62),day),hor=mix(vec3(.01,.015,.035),vec3(.8,.55,.38),day);
hor=mix(hor,vec3(1.,.28,.08),tw*.85);

float sd=max(dot(d,uSun),0.);
c+=vec3(1.,.6,.3)*pow(sd,6.)*(.2+tw)*sg+vec3(1.,.9,.75)*smoothstep(.9992,.9997,sd)*8.*sg;
return c;}`;
const END=`#include <tonemapping_fragment>
#include <encodings_fragment>`;
const U={uSun:{value:new V3()},uCam:{value:new V3()},uT:{value:0}};
const planetMat=new T.ShaderMaterial({uniforms:{...U,uLP:{value:new V3()},uLD:{value:new V3()}},
vertexShader:`attribute float aC;varying vec3 vP,vN;varying float vC;
void main(){vP=position;vN=normal;vC=aC;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:SK+`varying vec3 vP,vN;varying float vC;uniform vec3 uCam,uLP,uLD;
void main(){vec3 up=normalize(vP),N=normalize(vN),V=uCam-vP;float di=length(V);V/=di;
vec3 W1=vec3(.8,.1,.6),W2=vec3(-.5,.7,.3);
float p1=dot(vP,W1)*5.+sin(dot(vP,W2)*.7)*3.,p2=dot(vP,W2)*17.,k=smoothstep(140.,6.,di);
vec3 t1=W1-N*dot(W1,N),t2=W2-N*dot(W2,N);
vec3 n=normalize(N-t1*cos(p1)*.07*k-t2*cos(p2)*.05*k);
float nd=dot(n,uSun),su=dot(up,uSun),dayl=smoothstep(-.1,.3,su);
vec3 base=mix(vec3(.62,.33,.14),vec3(.30,.11,.06),smoothstep(.25,.75,vC));
vec3 lc=mix(vec3(1.6,.6,.25),vec3(1.7,1.5,1.25),smoothstep(0.,.5,su));

vec3 amb=mix(vec3(.01,.015,.04),vec3(.22,.28,.4),dayl)*(.6+.4*dot(n,up));
vec3 c=base*(lc*dif+amb);
c+=base*vec3(.9,.25,.1)*pow(clamp(1.-abs(nd),0.,1.),4.)*dif*.25;
float sp=step(.975,hs(floor(vP*40.)))*pow(max(dot(normalize(uSun+V),n),0.),24.)*dif*smoothstep(50.,3.,di);
c+=vec3(1.,.9,.7)*sp*3.;

vec3 uc=normalize(uCam),fd=normalize(-V-uc*dot(-V,uc)*.8+uc*.05);

const skyMat=new T.ShaderMaterial({uniforms:U,side:T.BackSide,depthWrite:false,depthTest:false,
vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:SK+`varying vec3 vD;uniform vec3 uCam;uniform float uT;
void main(){vec3 d=normalize(vD),up=normalize(uCam);vec3 c=skyCol(d,up);float day=smoothstep(-.18,.25,dot(up,uSun)),ab=step(-.02,dot(d,up));
vec3 s=d*170.,id=floor(s);float h=hs(id);
c+=vec3(.8,.9,1.)*step(.993,h)*smoothstep(.4,0.,length(fract(s)-.5))*(.5+.5*sin(uT*3.+h*99.))*(1.-day)*1.5;
vec3 m1=normalize(vec3(-.5,.55,.7)),m2=normalize(vec3(.7,.35,-.6));
c=mix(c,vec3(.8,.75,.7)*clamp(.5+dot(d-m1,uSun)*25.,.2,1.),smoothstep(.9988,.9992,dot(d,m1))*ab);
c=mix(c,vec3(.55,.65,.8)*clamp(.5+dot(d-m2,uSun)*40.,.2,1.),smoothstep(.9994,.9996,dot(d,m2))*ab);
gl_FragColor=vec4(c,1.);`+END+`}`});
/* ---------- Szene ---------- */
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(64,1,.1,4000);
const sky=new T.Mesh(new T.SphereGeometry(1,32,16),skyMat);sky.scale.setScalar(2500);sky.renderOrder=-1;sky.frustumCulled=false;scene.add(sky);
const hemi=new T.HemisphereLight(0xbfd0ff,0x7a4a30,.9),dirL=new T.DirectionalLight(0xffe6c8,1.4);scene.add(hemi,dirL,dirL.target);
function build(){const g=new T.SphereGeometry(1,360,180),P=g.attributes.position,n=P.count,aC=new Float32Array(n),keys=[],d=new V3();
for(let i=0;i<n;i++){d.fromBufferAttribute(P,i);keys.push(Math.round(d.x*3e3)+','+Math.round(d.y*3e3)+','+Math.round(d.z*3e3));const h=H(d);aC[i]=lc;P.setXYZ(i,d.x*h,d.y*h,d.z*h)}
g.setAttribute('aC',new T.BufferAttribute(aC,1));g.computeVertexNormals();
const N=g.attributes.normal,mp=new Map();
for(let i=0;i<n;i++){let a=mp.get(keys[i]);if(!a)mp.set(keys[i],a=[0,0,0]);a[0]+=N.getX(i);a[1]+=N.getY(i);a[2]+=N.getZ(i)}
for(let i=0;i<n;i++){const a=mp.get(keys[i]),l=Math.hypot(a[0],a[1],a[2])||1;N.setXYZ(i,a[0]/l,a[1]/l,a[2]/l)}
const m=new T.Mesh(g,planetMat);m.frustumCulled=false;scene.add(m)}
/* ---------- Fahrzeug ---------- */
const car=new T.Group();scene.add(car);
const M=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.45,metalness:.5,...o});
const orange=M(0xa83a12),dark=M(0x1d1d22,{roughness:.7,metalness:.6}),glow=(c)=>new T.MeshBasicMaterial({color:c});
const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0,p=car)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);p.add(m);return m};
add(new T.BoxGeometry(1.5,.35,3.3),dark,0,-.1,0);
add(new T.BoxGeometry(1.35,.3,1.7),orange,0,.2,.55);
add(new T.BoxGeometry(1.4,.2,1.5),orange,0,.1,-1.05,.14);
add(new T.SphereGeometry(.75,18,12),M(0x1a3344,{metalness:.9,roughness:.1,emissive:0x082030,transparent:true,opacity:.88}),0,.5,-.1).scale.set(1,.7,1.3);
[-.45,.9].forEach(z=>add(new T.TorusGeometry(.82,.045,6,16,Math.PI),dark,0,.05,z));
[-1,1].forEach(s=>{add(new T.BoxGeometry(.3,.28,2.5),orange,s*.95,-.02,.1);add(new T.BoxGeometry(.16,.12,.3),glow(0xfff2d0),s*.5,.12,-1.8);add(new T.BoxGeometry(.1,.1,.2),glow(0xff2a10),s*.6,.25,1.65)});
add(new T.CylinderGeometry(.3,.38,.6,12),dark,0,.15,1.75,Math.PI/2);
add(new T.BoxGeometry(1.7,.05,.5),orange,0,.95,1.5,-.12);[-.6,.6].forEach(x=>add(new T.BoxGeometry(.05,.6,.05),dark,x,.65,1.55));
add(new T.CylinderGeometry(.015,.015,1.3,5),dark,.55,.9,.85);add(new T.SphereGeometry(.05,8,6),glow(0xff3020),.55,1.55,.85);
const flame=add(new T.ConeGeometry(.24,1.4,10),new T.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:.8,blending:T.AdditiveBlending,depthWrite:false}),0,.15,2.7,Math.PI/2);
const WR=.55,S0=.95,LP=[[-1.15,0,-1.35],[1.15,0,-1.35],[-1.15,0,1.25],[1.15,0,1.25]].map(a=>new V3(...a)),wh=[];
LP.forEach((p,i)=>{const piv=new T.Group();piv.position.copy(p);car.add(piv);const sp=new T.Group();piv.add(sp);
add(new T.TorusGeometry(.4,.17,8,20),M(0x17171a,{roughness:.95,metalness:.1}),0,0,0,0,Math.PI/2,0,sp);
add(new T.CylinderGeometry(.28,.28,.4,12),orange,0,0,0,0,0,Math.PI/2,sp);
for(let k=0;k<3;k++)add(new T.BoxGeometry(.44,.7,.07),dark,0,0,0,k*Math.PI/3,0,0,sp);
wh.push({piv,sp,c:0})});
const shTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)})();
const shadow=new T.Mesh(new T.PlaneGeometry(4.2,5.6),new T.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));scene.add(shadow);
/* ---------- Staub ---------- */
const NP=260,pp=new Float32Array(NP*3),pa=new Float32Array(NP),ps=new Float32Array(NP),pl=new Float32Array(NP),pv=Array.from({length:NP},()=>new V3());let pi=0;
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));pg.setAttribute('aA',new T.BufferAttribute(pa,1));pg.setAttribute('aS',new T.BufferAttribute(ps,1));
const dustMat=new T.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uSz:{value:600},uCol:{value:new T.Color(.6,.4,.25)}},
vertexShader:`attribute float aA,aS;varying float vA;uniform float uSz;void main(){vA=aA;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aS*uSz/-mv.z;gl_Position=projectionMatrix*mv;}`,
fragmentShader:`varying float vA;uniform vec3 uCol;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(uCol,smoothstep(.5,.05,d)*vA*.4);`+END+`}`});
const dust=new T.Points(pg,dustMat);dust.frustumCulled=false;scene.add(dust);
/* ---------- Eingabe ---------- */
const K={};let jp=null,J0=[0,0],jx=0,jy=0,boost=0,jumpReq=0;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')jumpReq=1});addEventListener('keyup',e=>K[e.code]=0);
const jb=$('jb'),jk=$('jk'),bo=$('bo'),ju=$('ju');
function mv(e){let dx=e.clientX-J0[0],dy=e.clientY-J0[1];const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;jk.style.transform=`translate(${dx}px,${dy}px)`}
addEventListener('pointerdown',e=>{if(e.target.classList.contains('btn')||jp!==null)return;jp=e.pointerId;J0=[e.clientX,e.clientY];jb.style.display='block';jb.style.left=e.clientX+'px';jb.style.top=e.clientY+'px';mv(e)});
addEventListener('pointermove',e=>{if(e.pointerId===jp)mv(e)});
const pe=e=>{if(e.pointerId===jp){jp=null;jx=jy=0;jb.style.display='none'}};addEventListener('pointerup',pe);addEventListener('pointercancel',pe);
bo.addEventListener('pointerdown',()=>{boost=1;bo.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(t=>bo.addEventListener(t,()=>{boost=0;bo.classList.remove('on')}));
ju.addEventListener('pointerdown',()=>jumpReq=1);
/* ---------- Physik: Starrkörper, 4 Federbeine, Kugelgravität ---------- */
const d0=new V3(.3,.85,.4).normalize(),pos=d0.clone().multiplyScalar(H(d0)+3),vel=new V3(),om=new V3(),q=new Q().setFromUnitVectors(new V3(0,1,0),d0);
const sun=d0.clone().multiplyScalar(.3).addScaledVector(new V3().crossVectors(d0,new V3(0,0,1)).normalize(),.95).normalize();
const sAx=new V3().crossVectors(d0,sun).normalize(),cp=[0,1,2,3].map(()=>new V3()),cOn=[0,0,0,0],comp=[0,0,0,0];
let st=0,thr=0,spd=0,vf=0,G=15;
function step(dt){
const up=pos.clone().normalize(),N=TN(up);let acc=new V3(),tq=new V3(),n=0;
for(let i=0;i<4;i++){const r=LP[i].clone().applyQuaternion(q),wp=pos.clone().add(r),wl=wp.length(),wd=wp.clone().divideScalar(wl),c=H(wd)+S0-wl;cOn[i]=c>0;comp[i]=cl(c,0,1.1);
if(c>0){n++;const pv2=vel.clone().add(om.clone().cross(r));let F=16*comp[i]*(c>.65?2.2:1)-3.2*pv2.dot(N);
if(F>0){const f=N.clone().multiplyScalar(F);acc.add(f);tq.add(r.clone().cross(f))}cp[i].copy(wd).multiplyScalar(wl-S0+c)}}
vel.addScaledVector(acc,dt).addScaledVector(up,-G*dt);om.addScaledVector(tq,dt/1.4).multiplyScalar(1-dt*1.8);
const ub=new V3(0,1,0).applyQuaternion(q);om.addScaledVector(ub.clone().cross(n?N:up),dt*(n?3:2.5));
const w=om.length();if(w>1e-5)q.premultiply(new Q().setFromAxisAngle(om.clone().divideScalar(w),w*dt));q.normalize();
if(n){const fr=n/4,fw=new V3(0,0,-1).applyQuaternion(q);fw.addScaledVector(N,-fw.dot(N)).normalize();const rt=new V3().crossVectors(fw,N);
vf=vel.dot(fw);const vr=vel.dot(rt),vm=boost?58:34,ac=boost?46:28;
if(thr>0)vel.addScaledVector(fw,thr*ac*fr*dt*Math.max(0,1-Math.max(vf,0)/vm));

const d2=pos.clone().normalize(),gh=H(d2)+.35;if(pos.length()<gh){pos.copy(d2).multiplyScalar(gh);const vn2=vel.dot(d2);if(vn2<0)vel.addScaledVector(d2,-vn2*1.1)}}
/* ---------- Kamera & Loop ---------- */
const camPos=pos.clone().addScaledVector(d0,4),cUp=d0.clone(),cF=new V3(0,0,-1).applyQuaternion(q);
const emit=(p,v)=>{pp[pi*3]=p.x;pp[pi*3+1]=p.y;pp[pi*3+2]=p.z;pv[pi].copy(v);pl[pi]=1;pi=(pi+1)%NP};
const sandBase=new T.Color();let last=0,tt=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000||.016,.04);last=now;tt+=dt;
sun.applyAxisAngle(sAx,dt*.012);
let tx=(Math.abs(jx)>.1?jx:0)*1.15+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0);
let ty=(Math.abs(jy)>.1?-jy:0)*1.25+((K.KeyW||K.ArrowUp)?1:0)-((K.KeyS||K.ArrowDown)?1:0);
if(K.ShiftLeft||K.ShiftRight)boost=1;else if(!bo.classList.contains('on'))boost=0;
st+=(cl(tx,-1,1)-st)*Math.min(1,dt*8);thr=cl(ty,-1,1);
step(dt/2);step(dt/2);spd=vel.length();
const up=pos.clone().normalize(),fw=new V3(0,0,-1).applyQuaternion(q);
car.position.copy(pos);car.quaternion.copy(q);
wh.forEach((w,i)=>{w.c+=(comp[i]-w.c)*Math.min(1,dt*18);w.piv.position.y=-(S0-WR-w.c);if(i<2)w.piv.rotation.y=-st*.45;w.sp.rotation.x-=vf*dt/WR*.9});
flame.scale.set(1,boost&&spd>1?1+Math.sin(tt*60)*.15:.25,1);flame.material.opacity=boost?.85:.25;
const fr=Math.max(0,Math.min(1,dt*(boost?60:30)));
// Kamera
cUp.lerp(up,1-Math.exp(-dt*4)).normalize();
const f2=fw.clone().addScaledVector(up,-fw.dot(up)).normalize();cF.lerp(f2,1-Math.exp(-dt*3.5));cF.addScaledVector(up,-cF.dot(up)).normalize();
const tgt=pos.clone().addScaledVector(cF,-(8.5+spd*.03)).addScaledVector(up,3.6);camPos.lerp(tgt,1-Math.exp(-dt*6));
const gh=H(camPos.clone().normalize())+1.4;if(camPos.length()<gh)camPos.setLength(gh);
