{n:'Erste Düne',h:8,wv:[[['pl',4]],[['pl',3]]],p:{sp:.17,rk:.1,ne:0,rl:.03},u:['raf','kas'],t:'Die Sandkarawane naht. Grabe dich bis Höhe 8 hoch, ernte Gewürz (schnelle Folge = Combo!) und rüste Krieger aus. Krieger schlagen Plünderer. In der Schlacht rufst du Orbitalschläge (✦20).',nw:'Raffinerie + Sammler · Kaserne · Plünderer-Angriffe von oben · Spice-Combos'},

function gen(r){while(G.length<=r){const rr=G.length,row=[],p=L.p;for(let c=0;c<W;c++){let t=0,q=Math.random(),a=0;const z=k=>q<(a+=p[k]||0);if(rr>2&&z('ne'))t=3;else if(rr>2&&z('ts'))t=6;else if(rr>2&&z('gb'))t=7;else if(rr>1&&z('rk'))t=2;else if(rr>1&&z('sp'))t=1;else if(rr>1&&z('rl'))t=4;const v=Math.random();row.push({t,c,r:rr,s:rr<2?2:0,p:0,f:0,q:0,w:0,v:v<.22?1:v<.4?2:0})}G.push(row)}}
function n8(c,r,f){for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){if(!a&&!b)continue;const t=G[r+b]&&G[r+b][c+a];if(t)f(t)}}

function gain(a,b,n,tx){sp+=n;ft(a,b+.3,'+'+n+' ✦','#ffb347');if(tx)ft(a,b+.9,tx,'#fff27a');const X=a*T,Y=BY-(b-camS)*T;for(let i=0;i<Math.min(9,2+n/4);i++){const m=.7+Math.random()*.4;pa.push({fl:1,sx:X+(Math.random()-.5)*20,sy:Y+(Math.random()-.5)*20,l:m,m})}}
function defuse(t){const a=t.c+.5,b=t.r+.5;if(sp<15){ft(a,b,'Zu wenig ✦','#ff6a5a');return}sp-=15;t.f=0;if(t.t==3||t.t==6||t.t==7){const rw={3:35,6:12,7:25}[t.t],nm={3:'Wurmzahn!',6:'Salz geborgen',7:'Gas geerntet'}[t.t];t.cr=t.t==3?1:t.t==7?2:3;t.t=0;t.s=2;rev(t.c,t.r);burst(a,b,24,'#7dff8a');ft(a,b+.6,'ENTSCHÄRFT','#7dff8a');gain(a,b,rw,nm)}else ft(a,b,'Kein Nest! -15 ✦','#ff6a5a')}
function upg(k){const b=bl[k],lv=b.lv||0,uc=Math.ceil((B[b.k].c||60)*1.4*(lv+1));if(sp<uc){ft(b.c+.5,b.r+1,'Zu wenig ✦','#ff6a5a');return}sp-=uc;b.lv=lv+1;burst(b.c+.5,b.r+.5,20,'#ffd27a');ft(b.c+.5,b.r+1.1,'Stufe '+(b.lv+1)+'!','#fff27a');openB(b)}
function start(i){li=i;L=LV[i];if(L.rd)L.rd.d=0;L.E=Math.round(erate(L.wv));G=[];bl={};wk=[];un=[];Q=[];pa=[];ft_=[];sp=i?120:60;tp=1;off=0;mode=0;phase='play';sel=null;ds=0;wm=null;bt=null;cmb=1;lastSp=-99;en=[];ln=[];sw=L.p.ne?40:75;wn=0;gen(8);
 for(let c=0;c<W;c++)for(let r=0;r<2;r++)rev(c,r);bl[3]={k:'hub',hp:200,mx:200,c:3,r:0};
 for(let k=0;k<2;k++)wk.push({x:2.4+k*2.2,y:1.2,j:null,a:k});camS=null;$('ov').className='';$('bn').className='';sheet('');sm()}

function build(k){const d=B[k];if(sp<d.c){ft(sel.c+.5,sel.r+.5,'Zu wenig ✦','#ff6a5a');return}sp-=d.c;bl[sel.r*8+sel.c]={k,hp:100,mx:100,c:sel.c,r:sel.r};ft(sel.c+.5,sel.r+.8,'-'+d.c+' ✦','#ffb347');burst(sel.c+.5,sel.r+.3,16,'#e8b878');sheet('');sel=null}

 else if(d.u){const u=UN[d.u],n=un.filter(q=>q.b===b).length;h+=`<button class="${n>=d.cap+(b.lv||0)?'no':''}" onclick="train(${key})">${u.n} ausbilden <em>✦ ${Math.ceil(u.c/s)}</em> <small>${n}/${d.cap+(b.lv||0)} · ${u.pw?'⚔'+u.pw+' je':'holt ✦'}</small></button>`}
 else if(b.k=='tur')h+=`<p>⚔ ${(8*s).toFixed(1)} Kampfkraft</p>`;else if(b.k=='raf')h+=`<p>Ertrag ✦ ${(.45*(1+veins(b))*s).toFixed(2)}/s</p>`;{const lv=b.lv||0;if(lv<2){const uc=Math.ceil((d.c||60)*1.4*(lv+1));h+=`<button class="${sp<uc?'no':''}" style="margin-top:8px;width:100%" onclick="upg(${key})">⬆ Ausbau Stufe ${lv+2} <em>✦ ${uc}</em> <small>${UT[b.k]}</small></button>`}else h+='<small>Max. Ausbau</small>'}sheet(h)}
const veins=b=>{let v=0;n8(b.c,b.r,t=>{if(t.s==2&&t.t==1)v++});return v};
function hire(){if(wk.length>=6||sp<15){ft(3.5,1,wk.length>=6?'Maximum':'Zu wenig ✦','#ff6a5a');return}sp-=15;wk.push({x:3.5,y:.5,j:null,a:0});ft(3.5,1,'+1 Arbeiter','#9ff');openB(bl[3])}
function train(k){const b=bl[k],d=B[b.k],u=UN[d.u],c=Math.ceil(u.c/syn(b));if(un.filter(q=>q.b===b).length>=d.cap+(b.lv||0)){ft(b.c+.5,b.r+1,'Voll','#ff6a5a');return}if(sp<c){ft(b.c+.5,b.r+1,'Zu wenig ✦','#ff6a5a');return}sp-=c;un.push(nu(b,d.u));ft(b.c+.5,b.r+1,'+'+u.n+' ⚔'+u.pw,'#9f9');burst(b.c+.5,b.r+.2,10,'#ffd27a');openB(b)}
function unq(t){t.q=0;Q.splice(Q.indexOf(t),1);wk.forEach(w=>{if(w.j===t)w.j=null});t.w=0}
function tap(px,py){if($('ov').className)return;if(phase=='battle'){strike(px,py);return}const c=Math.floor(px/T),r=Math.floor(camS+(BY-py)/T),t=G[r]&&G[r][c];if(!t||phase=='battle'||phase=='end')return;
 const b=bl[r*8+c];if(b){openB(b);return}if(t.s==2){openBuild(c,r);return}sheet('');sel=null;
 if(t.s==1){if(mode){t.f=!t.f;if(t.f&&t.q)unq(t)}else if(t.f)defuse(t);else{t.q?unq(t):(t.q=1,Q.push(t))}}else ft(c+.5,r+.5,'Unerforscht','#c9a8d8')}

 if(t.r>tp){tp=t.r;off=0;gen(tp+5)}rev(t.c,t.r);const a=t.c+.5,b=t.r+.5;burst(a,b,18,'#e8b878');
 if(t.t==1){cmb=tm-lastSp<9?Math.min(5,cmb+1):1;lastSp=tm;gain(a,b,10*cmb,cmb>1?'COMBO ×'+cmb+'!':'');t.st=40}if(t.t==2)gain(a,b,3,'');if(t.t==3){worm(t);t.cr=1;t.t=0}if(t.t==4){gain(a,b,45,'RELIKT!');t.t=0}if(t.t==6){const w=dg[0];if(w){wk=wk.filter(q=>q!==w);ft(w.x,w.y+.5,'☠ Treibsand!','#e8c070')}t.cr=3;t.t=0}if(t.t==7){gas(t);t.cr=2;t.t=0}

function kill(b){delete bl[b.r*8+b.c];un=un.filter(u=>u.b!==b);burst(b.c+.5,b.r+.5,30,'#ff8a4a');if(b.k=='hub')end(0);if(sel&&sel.c==b.c&&sel.r==b.r){sheet('');sel=null}}

function startB(ws,mid){phase='battle';en=[];ln=[];sheet('');sel=null;$('bn').className='';const f=[];
 un.filter(u=>u.k!='sam').forEach(u=>{const m=syn(u.b)*(1+.3*(u.b.lv||0));f.push(mk(0,u.k,.8+Math.random()*5.4,1.3+Math.random()*1.4,FS[u.k].h*m,m,{u}))});

function ub(dt){const b=bt;b.t+=dt;b.cd-=dt;b.wt-=dt;
 if(b.wi<b.ws.length&&(b.wt<=0||!b.f.some(q=>q.s))){b.ws[b.wi].forEach(([k,n])=>{for(let i=0;i<n;i++)b.f.push(mk(1,k,.7+Math.random()*5.6,11+Math.random()*1.5+i*.12,FS[k].h,1))});b.wi++;b.wt=10;b.dn.push({x:3.5,y:9,t:'Welle '+b.wi+'!',c:'#ff9a8a',l:1.6})}
