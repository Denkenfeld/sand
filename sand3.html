  if(done&&b.k=='hub'){const full=wk.length+b.q.length>=WK.max;h+=`<button class="card full ${sp<WK.c||full?'no':''}" data-a="hire"><div class="t"><img src="${icon('wk',44)}"><div><b>Arbeiter anheuern</b><br><span class="chip">${SVG.sp}${WK.c}</span> <small>· ${WK.t} s · ${wk.length}/${WK.max}${b.q.length?' (+'+b.q.length+' unterwegs)':''}</small></div></div></button>`}
  else if(done&&d.u){const U=UN[d.u],cap=d.cap+b.lv,have=unitsOf(b)+b.q.length,cost=Math.ceil(U.c/s);h+=`<button class="card full ${have>=cap||sp<cost?'no':''}" data-a="train"><div class="t"><img src="${icon(d.u,44)}"><div><b>${U.n} ausbilden</b><br><span class="chip">${SVG.sp}${cost}</span> <small>· ${U.t} s · ${have}/${cap} · ${U.d}${s>1?' · Verbund −'+Math.round((1-1/s)*100)+' %':''}</small></div></div></button>`}
  if(done&&b.k!='cv'){const lv=b.lv;if(b.up)h+=`<div class="row"><div>⬆ Entwicklung läuft … ${Math.round(b.up.p*100)} %</div></div>`;else if(lv<2){const uc=upgradeCost(b);h+=`<button class="card full ${sp<uc?'no':''}" style="margin-top:8px" data-a="upg"><b>⬆ Ausbau auf Stufe ${lv+2}</b><span><span class="chip">${SVG.sp}${uc}</span> <small>· ${6+lv*4} s · ${UT[b.k]}</small></span></button>`}else h+='<small class="hint2">Maximale Ausbaustufe</small>'}
  if(b.k!='hub')h+=`<button class="dng full" style="margin-top:8px;min-height:38px" data-a="demo">${done?'Abreißen (+'+Math.floor((d.c||0)*.5)+' ✦)':'Abbrechen'}</button>`;
  sheet(h);selB=b;sel={c:b.c,r:b.r};sig=sigOf(b)}
 S.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a=='close'){snd('tap');sheet('');sel=null;build_=null;return}
  if(a=='build'&&build_){const{c,r}=build_,k=t.dataset.k;if(build(k,c,r)){sheet('');sel=null;build_=null}return}
  const b=selB;if(!b)return;
  if(a=='hire')hire();else if(a=='train')orderUnit(b);else if(a=='upg')upgrade(b);else if(a=='demo'){demolish(b);return}
  openInfo(b,true)});
 /* ---------- Menüs ---------- */
 const btn=(a,t,c,d)=>`<button class="${c||''}" data-a="${a}" ${d||''}>${t}</button>`;
 function panel(h){M.innerHTML='<div class="pn">'+h+'</div>';M.className='on';paused=true;sheet('')}
 function hide(){M.className='';paused=false}
 function main(){menuFrom='main';panel(`<h1 class="ttl">DÜNENTURM</h1><div class="sub">Baue · Verbinde · Überlebe</div><p>Grabe dich durch die Dünen, verbinde dein Netz aus Fließbändern und Strom – und halte die Karawane auf.</p><div class="col">${btn('play','▶ Spielen','pri')}${btn('levels','Levelwahl')}${btn('help','So funktioniert’s')}${btn('settings','Einstellungen')}</div>`)}
 function levels(){panel(`<h2>Levelwahl</h2><div class="col">${LV.map((l,i)=>{const ok=i<=SV.best;return `<button class="lv ${ok?'':'lock'}" data-a="${ok?'intro':'lock'}" data-i="${i}"><div class="n">${ok?i+1:'🔒'}</div><div><b>${l.n}</b><small>${l.sub} · Höhe ${l.h}${SV.best>i?' · ✓ geschafft':''}</small></div></button>`}).join('')}${btn(menuFrom=='pause'?'pause':'main','Zurück')}</div>`)}
 function intro(i){const l=LV[i];panel(`<h2>Level ${i+1}<br>${l.n}</h2><p>${l.t}</p><div class="tips">${l.nw.map(n=>`<span>${n}</span>`).join('')}</div><div class="col">${btn('go','Los geht’s','pri','data-i="'+i+'"')}${btn('levels','Levelwahl')}</div>`)}
 function help(){panel(`<h2>So funktioniert’s</h2><p style="text-align:left"><b>⛏ Graben:</b> Tippe leuchtende Felder – Arbeiter graben sie ab. Ziehe zum Scrollen.<br><br><b>🔗 Netz:</b> Bauen darfst du nur neben dem Quartier. Gebäude nebeneinander sind verbunden, Lücken schließen Fließbänder – pro Antippen baust du genau ein Element. Ohne Verbindung steht alles still.<br><br><b>✦ Spice:</b> Sammler holen ✦ von Adern, es fährt über die Bänder ins Quartier. Erst bei Ankunft gibt es Geld. Jede Raffinerie erreicht nur Adern in ihrem Umkreis (Kreis beim Antippen sichtbar, Ausbau vergrößert ihn). Leere Adern wachsen nach, aber jedes Mal mit halber Menge – baue Bänder nach oben und neue Raffinerien bei frischen Adern.<br><br><b>⚡ Strom & Munition:</b> Kommen vom Quartier und Energiefeldern über dasselbe Netz. Zerstörte Bänder trennen deine Basis! Fehlt einem Gebäude etwas, schwebt ein Symbol darüber (⚡ Strom, Kette = getrennt, Patrone = Munition). Die Strom-Anzeige oben blinkt dann rot – tippe sie an.<br><br><b>💧 Durst:</b> Mit der Zeit brauchen Arbeiter Wasser – baue einen Taufänger.<br><br><b>⚔ Ziel:</b> Erreiche die Zielhöhe, bevor dich Plünderer überrennen – dann folgt die große Schlacht.</p><div class="col">${btn(menuFrom=='pause'?'pause':'main','Zurück')}</div>`)}
 function settings(){const src=AU.source;panel(`<h2>Einstellungen</h2>
  <div class="set"><label>Musik</label><input type="range" id="smv" min="0" max="100" value="${Math.round(SV.mv*100)}"><button class="tg ${SV.mus?'on':''}" data-a="tmus" aria-label="Musik an/aus"></button></div>
  <div class="set"><label>Effekte</label><input type="range" id="ssv" min="0" max="100" value="${Math.round(SV.sv*100)}"></div>
  <div class="set"><label>Hohe Auflösung</label><span style="flex:1"></span><button class="tg ${SV.hi?'on':''}" data-a="thi" aria-label="Auflösung"></button></div>
  <small class="hint2">Musikquelle: ${src=='file'?'deine Datei (sand.mp3)':src=='gen'?'Wüsten-Ambient (erzeugt)':'wird beim Start geladen'}</small>
  <div class="col">${btn('mfile','♪ Musik-Datei wählen (sand.mp3)')}${src=='file'?btn('mclr','Standardmusik'):''}${btn('reset','Fortschritt zurücksetzen','dng')}${btn(menuFrom=='pause'?'pause':'main','Zurück','pri')}</div>`);
  const mv=$('smv'),sv=$('ssv');mv.oninput=()=>{SV.mv=mv.value/100;AU.setVol();persist()};sv.oninput=()=>{SV.sv=sv.value/100;AU.setVol();persist()};sv.onchange=()=>snd('ting',3.5)}
 function pause(){menuFrom='pause';panel(`<h2>Pause</h2><div class="col">${btn('resume','▶ Weiterspielen','pri')}${btn('restart','↺ Level neu starten')}${btn('levels','Levelwahl')}${btn('settings','Einstellungen')}${btn('help','So funktioniert’s')}${btn('main','Hauptmenü')}</div>`)}
 function endP(w){const last=li+1>=LV.length;panel(w?`<h2>Sieg!</h2><p>Die Karawane ist zerschlagen – Level ${li+1} geschafft.<br>Übrig: <b>${Math.floor(sp)} ✦</b></p><div class="col">${last?btn('go','Level '+(li+1)+' nochmal','pri','data-i="'+li+'"'):btn('intro','Weiter zu Level '+(li+2),'pri','data-i="'+(li+1)+'"')}${btn('levels','Levelwahl')}${btn('main','Hauptmenü')}</div>`:`<h2>Besiegt</h2><p>${bt?'Deine Basis fiel.':'Das Quartier wurde verschlungen.'}<br><small>Tipp: Krieger schlagen Plünderer, Crawler knacken Panzer. Verbund, Ausbau und Orbitalschläge entscheiden Kämpfe.</small></p><div class="col">${btn('go','Nochmal versuchen','pri','data-i="'+li+'"')}${btn('levels','Levelwahl')}${btn('main','Hauptmenü')}</div>`)}
 M.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;AU.init();AU.resume();
  if(a=='go'||a=='play'){snd('open');AU.loadMusic();if(a=='go'){start(i);hide()}else intro(Math.min(SV.best,LV.length-1));return}
  snd('tap');
  if(a=='intro')intro(i);else if(a=='lock')toast('Schließe das vorherige Level ab');else if(a=='levels')levels();else if(a=='help')help();else if(a=='settings')settings();else if(a=='main')main();else if(a=='pause')pause();
  else if(a=='resume')hide();else if(a=='restart'){start(li);hide()}
  else if(a=='tmus'){SV.mus=SV.mus?0:1;persist();AU.setVol();settings()}else if(a=='thi'){SV.hi=SV.hi?0:1;persist();rs();settings()}
  else if(a=='mfile')$('mf').click();else if(a=='mclr'){AU.clearFile().then(()=>settings())}
  else if(a=='reset'){if(t.dataset.c){SV.best=0;persist();toast('Fortschritt gelöscht',1);levels()}else{t.dataset.c=1;t.textContent='Wirklich löschen? Nochmal tippen'}}});
 $('mf').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;AU.init();AU.resume();const ok=await AU.setFile(f);toast(ok?'Musik geladen ♪':'Datei konnte nicht gelesen werden',ok);e.target.value='';if(M.className=='on')settings()});
 $('menub').onclick=()=>{snd('open');pause()};
 $('p_pw').onclick=()=>{if(paused||phase=='battle')return;snd('tap');const un_=unsupplied(),lowp=DEM>SUP+.001;
  let b=un_[0]||Object.values(bl).find(o=>o.bp>=1&&o.k!='cv'&&needsOf(o).some(n=>n.k=='bolt'));
  if(!un_.length&&!lowp){toast('⚡ Strom ok: '+SUP.toFixed(0)+' erzeugt, '+DEM.toFixed(1)+' gebraucht.',1);return}
  toast(un_.length?'⚠ '+un_.length+' Gebäude nicht angeschlossen – per Fließband mit dem Quartier verbinden.':'⚡ Zu wenig Strom: '+SUP.toFixed(0)+' erzeugt, '+DEM.toFixed(1)+' gebraucht. Baue ein Energiefeld.');
  if(b){const tc=camTarget();off=b.r-(BY-VH*.4)/T-tc;openInfo(b)}};
 $('bnb').onclick=()=>{snd('tap');fight()};
 $('tbase').onclick=()=>{snd('tap');off=-1e3};$('tfront').onclick=()=>{snd('tap');off=0};$('tmode').onclick=()=>{mode^=1;setMode();snd('tap')};
 return{reset,banner,sheet,hud,end:endP,main,pause,openBuildMenu,openInfo,intro,get selB(){return selB}}
})();
/* ---------- Eingabe ---------- */
let dn=null;
function tap(px,py){
 if(phase=='battle'){strike(px,py);return}if(phase=='end'||phase=='menu')return;
 const c=Math.floor(px/T),r=Math.floor(camS+(BY-py)/T),t=tw(c,r);if(!t)return;
 const b=bAt(c,r);
 if(b){snd('open');UI.openInfo(b);return}
 if(t.s==2){if(!adj(c,r,true)){toast('Nicht mit dem Quartier verbunden – Bänder dorthin legen');ft(c+.5,r+.5,'Nicht verbunden','#ff9a8a');snd('err');UI.sheet('');sel=null;return}snd('open');UI.openBuildMenu(c,r);return}
 UI.sheet('');sel=null;
 if(t.s==1){if(mode){t.f=!t.f;if(t.f&&t.q){t.q=0;const i=Q.indexOf(t);if(i>=0)Q.splice(i,1)}snd('flag',c+.5)}else if(t.f)defuse(t);else if(t.q){t.q=0;t.p=Math.max(0,t.p);Q.splice(Q.indexOf(t),1);snd('tap')}else{t.q=1;Q.push(t);snd('tap')}}
 else{ft(c+.5,r+.5,'Unerforscht','#c9a8d8');snd('tap')}}
function tileAt(px,py){const c=Math.floor(px/T),r=Math.floor(camS+(BY-py)/T);return[c,r]}
cv.addEventListener('pointerdown',e=>{AU.init();AU.resume();dn={x:e.clientX,y:e.clientY,o:off,m:0,};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!dn)return;const d=e.clientY-dn.y;
 if(Math.abs(d)>8)dn.m=1;if(dn.m&&phase!='battle')off=dn.o+d/T});
cv.addEventListener('pointerup',e=>{if(dn&&!dn.m)tap(e.clientX,e.clientY);dn=null});
cv.addEventListener('pointercancel',()=>{dn=null});
addEventListener('resize',()=>{rs()});
document.addEventListener('visibilitychange',()=>{AU.hide(document.hidden);if(document.hidden&&M.className!='on'&&phase!='menu'&&phase!='end')UI.pause()});
/* ---------- Hauptschleife ---------- */
let lt=0,hudT=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lt)/1e3||0);lt=t;tm+=dt;if(!paused)up(dt);draw();hudT-=dt;if(hudT<=0){hudT=.12;UI.hud()}}
const M=$('M');
rs();start(Math.min(SV.best,LV.length-1));paused=true;UI.main();requestAnimationFrame(loop);
if(location.hash=='#debug')window.__g={ev:s=>eval(s),step(sec,dt){dt=dt||.05;for(let i=0;i<sec/dt;i++){tm+=dt;up(dt)}},draw,tapC(c,r){tap((c+.5)*T,BY-(r+.5-camS)*T)},tileXY:(c,r)=>[(c+.5)*T,BY-(r+.5-camS)*T]};
})();
</script>
