const sk=makeSky({zen:0x1a0820,mid:0x5a1a30,hor:0xe0603a,stars:.5,sunK:.4});sk.u.uSun.value.set(-.7,.08,-.7).normalize();F.add(sk.mesh);F.fog=new T.Fog(0x8a3a30,200,1100);

 vec3 sc=vec3(.86,.8,.72)-vec3(.2,.5,.5)*smoothstep(.55,.75,fbm(n*9.+2.))*.9;vec3 ir=mix(vec3(1.,.62,.2),vec3(.2,.9,1.),r/.55)*ring*(1.+uP*.8);vec3 c=mix(sc,ir,iris);

const KE=[[17.6,0,10,380,0,0,0,56],[19.6,10,6,250,0,0,0,50],[21.2,0,0,190,0,0,0,44],[22.5,0,0,150,0,0,0,40]];

{const b=mk(new T.CylinderGeometry(.22,.3,1.2,10),0x92705a);b.position.y=.6;const l=bas(new T.CylinderGeometry(.14,.14,.24,8),0xffcf80);l.position.y=1.32;const r=mk(new T.ConeGeometry(.2,.26,8),0x2e1e28);r.position.y=1.58;
 const sw=new T.Mesh(new T.ConeGeometry(.9,5,16,1,true).translate(0,-2.5,0).rotateZ(-Math.PI/2),bmat(0x72dcff,.25));sw.position.y=1.32;TWG.add(b,l,r,sw);TWG.userData.sw=sw}
